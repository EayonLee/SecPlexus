version: "2"
# IAM 的 PostgreSQL 数据访问由 sqlc 生成；schema 直接取 goose 迁移，不维护第二份 DDL。
# 使用 database/sql 风味：生成的 DBTX 接口同时被 *sql.DB（根池）与 *sql.Tx（事务）满足，
# 因此查询与调用方事务天然共用一条连接，不需要第二套事务管理。
# 未切到 pgx/v5 风味：那会让生成的参数类型变成 pgx 专属，把驱动耦合进仓库签名；
# 当前唯一收益是数组绑定语法，而数组已用 jsonb 展开，收益不足。
sql:
  - engine: postgresql
    schema: src/apps/iam/migrations
    queries: src/apps/iam/internal/repository/queries
    gen:
      go:
        package: sqlcgen
        out: src/apps/iam/internal/repository/sqlcgen
        sql_package: database/sql
        emit_json_tags: false
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        # 只生成被查询引用到的表模型，未迁移的表不会产生无用结构体。
        omit_unused_structs: true
        overrides:
          - db_type: "uuid"
            go_type: { import: "github.com/google/uuid", type: "UUID" }
          - db_type: "uuid"
            nullable: true
            go_type: { import: "github.com/google/uuid", type: "UUID", pointer: true }
          # 封闭取值列直接映射为 enum 常量类型：状态与风险级别在编译期受约束，
          # 不需要在包装层再做一次字符串转换。
          - column: "iam.permissions.status"
            go_type: { import: "github.com/EayonLee/SecPlexus/src/apps/iam/internal/enum", type: "PermissionStatus" }
          - column: "iam.permissions.risk_level"
            go_type: { import: "github.com/EayonLee/SecPlexus/src/apps/iam/internal/enum", type: "RiskLevel" }
          - column: "iam.users.status"
            go_type: { import: "github.com/EayonLee/SecPlexus/src/apps/iam/internal/enum", type: "UserStatus" }
          - column: "iam.user_sessions.state"
            go_type: { import: "github.com/EayonLee/SecPlexus/src/apps/iam/internal/enum", type: "SessionState" }
          - db_type: "jsonb"
            go_type: { import: "encoding/json", type: "RawMessage" }