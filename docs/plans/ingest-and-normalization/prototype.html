<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>数据源接入 · 原型 · SecPlexus</title>
<style>
  :root{--background:#fff;--foreground:#0a1317;--card:#fff;--primary:#0064e0;--primary-foreground:#fff;
    --secondary:#f1f4f7;--muted-foreground:#5d6c7b;--destructive:#e41e3f;--border:#dee3e9;--input:#ced0d4;
    --radius:.75rem;--success:#31a24c;--attention:#f2a918;--chart-1:#0064e0;--chart-2:#1876f2;
    --chart-4:#8a8a8a;--chart-5:#6b6b6b;--ring:#0064e0}
  @media (prefers-color-scheme:dark){:root{--background:#0a0a0a;--foreground:#fafafa;--card:#171717;
    --primary:#0091ff;--primary-foreground:#0a1317;--secondary:#262626;--muted-foreground:#a3a3a3;
    --destructive:#f0284a;--border:#262626;--input:#333;--chart-1:#0091ff;--chart-2:#66b8ff;
    --chart-4:#a3a3a3;--chart-5:#d4d4d4;--ring:#0091ff}}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:Montserrat,"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    background:var(--background);color:var(--foreground);font-size:14px;line-height:1.5;letter-spacing:-.01em;
    -webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit}
  .shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
  .sidebar{border-right:1px solid var(--border);background:var(--card);padding:16px 12px;display:flex;
    flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:9px;padding:4px 8px}
  .brand-mark{width:26px;height:26px;border-radius:8px;background:var(--primary);color:var(--primary-foreground);
    display:grid;place-items:center;font-weight:700;font-size:13px}
  .brand-name{font-weight:600;letter-spacing:-.02em}
  .nav-group{display:flex;flex-direction:column;gap:2px}
  .nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-foreground);
    padding:0 8px 6px;font-weight:600}
  .nav-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:10px;
    color:var(--muted-foreground);text-decoration:none;font-size:13.5px;cursor:pointer;border:0;background:none;
    text-align:left;width:100%}
  .nav-item:hover{background:var(--secondary);color:var(--foreground)}
  .nav-item[aria-current=page]{background:var(--secondary);color:var(--foreground);font-weight:600}
  .nav-item svg{width:16px;height:16px;opacity:.8;flex:none}
  .nav-sub{padding-left:26px;font-size:13px}
  .main{min-width:0}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:13px 26px;
    border-bottom:1px solid var(--border)}
  .crumbs{color:var(--muted-foreground);font-size:12.5px}
  .crumbs b{color:var(--foreground);font-weight:600}
  .avatar{width:28px;height:28px;border-radius:999px;background:var(--secondary);display:grid;
    place-items:center;font-size:12px;font-weight:600}
  .content{padding:22px 26px 60px;max-width:1320px}
  h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.02em}
  .segmented{display:inline-flex;border:1px solid var(--input);border-radius:999px;padding:2px;gap:2px;
    background:var(--card)}
  .segmented button{border:0;background:transparent;padding:5px 13px;border-radius:999px;font-size:12.5px;
    color:var(--muted-foreground);cursor:pointer;font-weight:500}
  .segmented button[aria-selected=true]{background:var(--secondary);color:var(--foreground);font-weight:600}
  .toolbar{display:flex;align-items:center;gap:8px;margin:16px 0 12px;flex-wrap:wrap}
  .toolbar .spacer{margin-left:auto}
  .input-group{display:flex;align-items:center;gap:7px;height:32px;padding:0 10px;
    border:1px solid var(--input);border-radius:999px;background:var(--card);min-width:230px}
  .input-group:focus-within{outline:2px solid var(--ring);outline-offset:1px}
  .input-group input{border:0;outline:0;background:transparent;width:100%;font-size:13px;color:var(--foreground)}
  .input-group svg{width:15px;height:15px;color:var(--muted-foreground);flex:none}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 14px;
    border-radius:999px;border:1px solid transparent;background:var(--primary);color:var(--primary-foreground);
    font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
  .btn:hover{opacity:.9}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn-outline{background:var(--card);border-color:var(--input);color:var(--foreground);font-weight:500}
  .btn-outline:hover{background:var(--secondary);opacity:1}
  .btn-danger{background:transparent;border-color:var(--input);color:var(--destructive)}
  .btn-sm{height:28px;padding:0 11px;font-size:12.5px}
  .btn svg{width:15px;height:15px}
  .table-card{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--card)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:left;font-weight:500;color:var(--muted-foreground);padding:9px 13px;
    border-bottom:1px solid var(--border);font-size:12px;white-space:nowrap}
  tbody td{padding:11px 13px;border-bottom:1px solid var(--border);vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--secondary)}
  .cell-name{font-weight:600}
  .cell-sub{color:var(--muted-foreground);font-size:12px;margin-top:2px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
  .dim{color:var(--muted-foreground)}
  .badge{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 9px;border-radius:999px;
    background:var(--secondary);color:var(--foreground);font-size:11.5px;font-weight:500;white-space:nowrap}
  .badge-dot{width:6px;height:6px;border-radius:999px;background:var(--muted-foreground)}
  .badge-ok .badge-dot{background:var(--success)}
  .badge-warn .badge-dot{background:var(--attention)}
  .badge-err .badge-dot{background:var(--destructive)}
  .badge-idle .badge-dot{background:var(--muted-foreground)}
  .badge-outline{background:transparent;border:1px solid var(--input)}
  .scrim{position:fixed;inset:0;background:rgba(10,19,23,.38);opacity:0;pointer-events:none;
    transition:opacity .18s;z-index:40}
  .scrim.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;top:0;right:0;height:100vh;width:min(960px,96vw);background:var(--card);
    border-left:1px solid var(--border);display:flex;flex-direction:column;transform:translateX(101%);
    transition:transform .22s cubic-bezier(.32,.72,0,1);z-index:41}
  .sheet.open{transform:none}
  .sheet-head{display:flex;align-items:flex-start;gap:12px;padding:15px 20px;border-bottom:1px solid var(--border)}
  .sheet-head h2{margin:0;font-size:15px;font-weight:600}
  .sheet-head p{margin:2px 0 0;font-size:12.5px;color:var(--muted-foreground)}
  .icon-btn{margin-left:auto;width:28px;height:28px;border-radius:999px;border:0;background:transparent;
    color:var(--muted-foreground);cursor:pointer;display:grid;place-items:center;flex:none}
  .icon-btn:hover{background:var(--secondary);color:var(--foreground)}
  .sheet-body{padding:18px 20px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:18px}
  .sheet-foot{padding:12px 20px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px}
  .sheet-foot .spacer{margin-left:auto}
  .steps{display:flex;align-items:center;padding:0 20px;margin-top:4px;flex-wrap:nowrap;overflow-x:auto}
  .step{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted-foreground);white-space:nowrap}
  .step-num{width:21px;height:21px;border-radius:999px;border:1px solid var(--input);display:grid;
    place-items:center;font-size:11px;font-weight:600;flex:none}
  .step.active{color:var(--foreground);font-weight:600}
  .step.active .step-num{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
  .step.done .step-num{background:var(--secondary);border-color:var(--input);color:var(--foreground)}
  .step-line{flex:1;height:1px;background:var(--border);margin:0 8px;min-width:10px}
  .option-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .option{text-align:left;border:1px solid var(--input);border-radius:var(--radius);background:var(--card);
    padding:13px;cursor:pointer;display:flex;flex-direction:column;gap:7px}
  .option:hover{border-color:var(--muted-foreground)}
  .option[aria-pressed=true]{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary) inset}
  .option-top{display:flex;align-items:center;gap:8px}
  .option-icon{width:26px;height:26px;border-radius:8px;background:var(--secondary);display:grid;
    place-items:center;flex:none}
  .option-icon svg{width:15px;height:15px}
  .option-title{font-weight:600;font-size:13.5px}
  .option-desc{color:var(--muted-foreground);font-size:12px;line-height:1.45}
  .option[aria-pressed=true] .option-icon{background:var(--primary);color:var(--primary-foreground)}
  .fieldset{display:flex;flex-direction:column;gap:9px}
  .legend{font-size:11.5px;font-weight:600;color:var(--muted-foreground);text-transform:uppercase;
    letter-spacing:.06em;display:flex;align-items:center;gap:8px}
  .legend .hint-inline{font-weight:400;text-transform:none;letter-spacing:0;font-size:11.5px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:12.5px;font-weight:500}
  .field input,.field select,.field textarea{height:33px;border-radius:10px;border:1px solid var(--input);
    background:var(--card);color:var(--foreground);padding:0 11px;font:inherit;font-size:13px}
  .field textarea{height:auto;padding:9px 11px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:11.5px;line-height:1.5;resize:vertical;min-height:88px}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--ring);outline-offset:1px}
  .field .hint{font-size:11.5px;color:var(--muted-foreground)}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .template-list{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--radius);
    overflow:hidden;max-height:290px;overflow-y:auto}
  .template-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--border);
    cursor:pointer;background:var(--card);text-align:left;width:100%;border-left:0;border-right:0;border-top:0}
  .template-row:last-child{border-bottom:0}
  .template-row:hover{background:var(--secondary)}
  .template-row[aria-pressed=true]{background:var(--secondary)}
  .tick{margin-left:auto;opacity:0;color:var(--primary);display:grid;place-items:center}
  .template-row[aria-pressed=true] .tick{opacity:1}
  .tick svg{width:16px;height:16px}
  .kv{display:grid;grid-template-columns:132px 1fr;gap:8px 14px;font-size:13px;align-items:baseline}
  .kv dt{color:var(--muted-foreground);font-size:12.5px}
  .kv dd{margin:0;min-width:0}
  .code-box{display:flex;align-items:center;gap:8px;background:var(--secondary);border-radius:10px;
    padding:8px 10px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;
    word-break:break-all}
  .code-box .grow{flex:1;min-width:0}
  .copy{border:0;background:transparent;color:var(--muted-foreground);cursor:pointer;flex:none;
    display:grid;place-items:center}
  .copy:hover{color:var(--foreground)}
  .callout{display:flex;gap:9px;padding:10px 12px;border-radius:10px;background:var(--secondary);
    font-size:12.5px;line-height:1.5;align-items:flex-start}
  .callout svg{width:15px;height:15px;flex:none;margin-top:1px;color:var(--muted-foreground)}
  .callout-warn{background:color-mix(in srgb,var(--attention) 14%,var(--card))}
  .callout-warn svg{color:var(--attention)}
  .callout-ok{background:color-mix(in srgb,var(--success) 12%,var(--card))}
  .callout-ok svg{color:var(--success)}
  .callout-err{background:color-mix(in srgb,var(--destructive) 12%,var(--card))}
  .callout-err svg{color:var(--destructive)}
  pre.event{margin:0;padding:11px;border-radius:10px;background:var(--secondary);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.55;
    overflow:auto;max-height:290px;color:var(--foreground)}
  .ev-key{color:var(--chart-1)}
  .ev-num{color:var(--chart-5)}
  .ev-str{color:var(--success)}
  .ev-null{color:var(--muted-foreground)}
  .empty{padding:36px 20px;text-align:center;color:var(--muted-foreground);font-size:13px}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);padding:0 20px;overflow-x:auto}
  .tab{border:0;background:transparent;padding:9px 11px;font-size:12.5px;color:var(--muted-foreground);
    cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500;white-space:nowrap}
  .tab:hover{color:var(--foreground)}
  .tab[aria-selected=true]{color:var(--foreground);border-bottom-color:var(--primary);font-weight:600}
  .panel{border:1px solid var(--border);border-radius:var(--radius);margin:0}
  .panel-row{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:9px 12px;
    border-bottom:1px solid var(--border);font-size:12.5px}
  .panel-row:last-child{border-bottom:0}
  .panel-row dt{color:var(--muted-foreground);margin:0}
  .panel-row dd{margin:0;min-width:0}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .map-table{width:100%;border-collapse:collapse;font-size:12px}
  .map-table th{text-align:left;color:var(--muted-foreground);font-weight:500;font-size:11px;
    padding:5px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
  .map-table td{padding:5px 8px;border-bottom:1px solid var(--border)}
  .map-table tr:last-child td{border-bottom:0}
  .map-src{color:var(--muted-foreground)}
  .map-ok{color:var(--success)}
  .map-miss{color:var(--attention)}
  .quality{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .stat{border:1px solid var(--border);border-radius:var(--radius);padding:11px 12px}
  .stat-label{font-size:11.5px;color:var(--muted-foreground)}
  .stat-value{font-size:19px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
  .stat-value small{font-size:11.5px;font-weight:500;color:var(--muted-foreground)}
  .bar{height:5px;border-radius:999px;background:var(--secondary);margin-top:8px;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:999px;background:var(--chart-1)}
  .stream{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--radius);
    overflow:hidden;font-size:12px}
  .stream-row{display:grid;grid-template-columns:62px 1fr auto;gap:10px;padding:8px 11px;
    border-bottom:1px solid var(--border);align-items:center}
  .stream-row:last-child{border-bottom:0}
  .stream-row.bad{background:color-mix(in srgb,var(--destructive) 8%,var(--card))}
  .stream-time{color:var(--muted-foreground);font-family:ui-monospace,Menlo,monospace}
  .stream-msg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{display:inline-block;padding:0 7px;height:18px;line-height:18px;border-radius:999px;
    background:var(--secondary);font-size:10.5px;font-weight:600;margin-left:6px}
  .pill-ok{color:var(--success)}
  .pill-bad{color:var(--destructive)}
  .pill-warn{color:var(--attention)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--input);border-radius:999px;
    padding:4px 10px;font-size:12px;background:var(--card)}
  .chip[aria-pressed=true]{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,var(--card));
    font-weight:600}
  .kpi{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .kpi .stat-value{font-size:21px}
  .spark{display:block;width:100%;height:34px;margin-top:6px}
  .spark path{fill:none;stroke:var(--chart-1);stroke-width:1.6}
  .spark .area{fill:color-mix(in srgb,var(--chart-1) 12%,transparent);stroke:none}
  .tmpl-card{border:1px solid var(--border);border-radius:var(--radius);padding:12px;background:var(--card);
    display:flex;flex-direction:column;gap:7px;cursor:pointer}
  .tmpl-card:hover{background:var(--secondary)}
  .tmpl-head{display:flex;align-items:flex-start;gap:8px}
  .tmpl-name{font-weight:600;font-size:13px}
  .tmpl-meta{color:var(--muted-foreground);font-size:11.5px}
  .mini-bar{height:4px;border-radius:999px;background:var(--secondary);overflow:hidden}
  .mini-bar>i{display:block;height:100%;background:var(--chart-1)}
  .grid-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .divider{height:1px;background:var(--border);margin:2px 0}
  @media (max-width:1100px){.kpi{grid-template-columns:repeat(2,1fr)}
    .grid-cards{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:900px){
    .shell{grid-template-columns:1fr}.sidebar{display:none}
    .option-grid,.grid-3,.two-col,.grid-cards{grid-template-columns:1fr}
    .quality{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">S</span><span class="brand-name">SecPlexus</span></div>
    <nav class="nav-group" aria-label="主导航">
      <span class="nav-label">工作区</span>
      <button class="nav-item" type="button">工作台</button>
      <button class="nav-item" type="button">事件</button>
      <button class="nav-item" type="button">审计日志</button>
    </nav>
    <nav class="nav-group" aria-label="设置导航">
      <span class="nav-label">设置</span>
      <button class="nav-item" type="button">个人资料</button>
      <button class="nav-item" type="button">用户管理</button>
      <button class="nav-item" type="button">角色与权限</button>
      <button class="nav-item" type="button" aria-current="page">数据源</button>
      <button class="nav-item nav-sub" type="button" data-view="connectors">接入点</button>
      <button class="nav-item nav-sub" type="button" data-view="templates">模板目录</button>
      <button class="nav-item nav-sub" type="button" data-view="metrics">运行指标</button>
    </nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="crumbs">设置 / <b>数据源</b> <span id="crumbLeaf"></span></div>
      <div class="avatar" title="EayonLee">EL</div>
    </div>
    <div class="content" id="view"></div>
  </main>
</div>

<div class="scrim" id="scrim"></div>

<section class="sheet" id="wizard" role="dialog" aria-modal="true" aria-labelledby="wizardTitle" aria-hidden="true">
  <div class="sheet-head">
    <div><h2 id="wizardTitle">接入数据源</h2><p id="wizardSub"></p></div>
    <button class="icon-btn" data-close aria-label="关闭"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="steps" id="steps"></div>
  <div class="sheet-body" id="wizardBody"></div>
  <div class="sheet-foot">
    <button class="btn btn-outline btn-sm" id="wizCancel">取消</button>
    <span class="spacer"></span>
    <button class="btn btn-outline btn-sm" id="wizPrev">上一步</button>
    <button class="btn btn-sm" id="wizNext">下一步</button>
  </div>
</section>

<section class="sheet" id="detail" role="dialog" aria-modal="true" aria-labelledby="detailTitle" aria-hidden="true">
  <div class="sheet-head">
    <div><h2 id="detailTitle">数据源</h2><p id="detailSub"></p></div>
    <button class="icon-btn" data-close aria-label="关闭"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="tabs" id="detailTabs" role="tablist">
    <button class="tab" role="tab" data-tab="overview" aria-selected="true">概览</button>
    <button class="tab" role="tab" data-tab="diagnose" aria-selected="false">诊断</button>
    <button class="tab" role="tab" data-tab="messages" aria-selected="false">收到的消息</button>
    <button class="tab" role="tab" data-tab="quality" aria-selected="false">映射质量</button>
    <button class="tab" role="tab" data-tab="publish" aria-selected="false">发布</button>
  </div>
  <div class="sheet-body" id="detailBody"></div>
  <div class="sheet-foot">
    <button class="btn btn-danger btn-sm" id="detailDelete">删除</button>
    <span class="spacer"></span>
    <button class="btn btn-outline btn-sm" id="detailToggle">停止</button>
    <button class="btn btn-sm" id="detailStart">启动</button>
  </div>
</section>

<section class="sheet" id="tplSheet" role="dialog" aria-modal="true" aria-labelledby="tplTitle" aria-hidden="true">

/* 状态机对照 Graylog InputStateBadge（RUNNING/STARTING/FAILED/FAILING/STOPPED + 未运行）

   draft 创建未启动；starting 端口绑定中；running 正常；pending 启动后从未收到事件（Wazuh never_connected）；
   silent 曾有事件但 15 分钟无入站；degraded 有事件但质量降级（隔离/解析失败超阈值，Graylog FAILING）；
   failed 启动失败（端口绑定冲突等，原始错误保留展示）；stopped 手动停止。 */
const STATE = {
  draft:   { label:"待启动", kind:"idle" },
  starting:{ label:"启动中", kind:"idle" },
  running: { label:"运行中", kind:"ok" },
  pending: { label:"运行中 · 从未收到", kind:"warn" },
  silent:  { label:"运行中 · 无流量", kind:"err" },
  degraded:{ label:"运行中 · 质量降级", kind:"err" },
  failed:  { label:"启动失败", kind:"err" },
  stopped: { label:"已停止", kind:"warn" }
};
const STATE_ORDER = ["all","running","pending","degraded","silent","failed","draft","stopped"];
/* 从指标派生运行态的健康结论（OpenCTI IngestionHealth 的 status/status_since 模式）：阈值写死，防 抖动留给实施。 */
function derivedHealth(c) {
  if (c.state === "running" && c.quarantine > 2) return STATE.degraded.label;
  return STATE[c.state] ? STATE[c.state].label : c.state;
}

function sparkline(values) {

  const pts = values.map(function (v, i) {

    const y = h - 3 - ((v - min) / span) * (h - 8);
    return x.toFixed(1) + "," + y.toFixed(1);

  if (/^[A-Za-z0-9_.-]+=/.test(t)) return { format:"KV", note:"键值对，多分隔符" };
  return { format:"纯文本", note:"无结构，整体作为 message" };
}
function detectEncoding(text) {
  // 浏览器里已被解码成字符串；这里演示"探测结论"的呈现位置。
  const hasReplacement = text.indexOf("\uFFFD") >= 0;
  if (hasReplacement) return { encoding:"GB18030 → UTF-8（有损）", lossy:true };
  return { encoding:"UTF-8（严格）", lossy:false };
}
function parseTime(raw, t) {
  const v = raw[t.timeField];
  if (v === undefined || v === null || v === "") return { value:null, ok:false, note:"字段缺失，置 null 并记 warning" };
  if (t.timeFormat === "unix_ms") {
    const n = Number(v);
    if (!isFinite(n) || n <= 0) return { value:null, ok:false, note:"非法毫秒时间戳" };
    return { value:new Date(n).toISOString(), ok:true, note:"unix_ms → ISO" };
  }
  const d = new Date(v);
  if (isNaN(d.getTime())) return { value:null, ok:false, note:"非法 RFC3339" };
  return { value:d.toISOString(), ok:true, note:"RFC3339 → ISO" };
}
function parseSeverity(raw, t) {
  if (!t.severityField) return { value:0, ok:true, note:"模板未声明 severity 字段，0 (Unknown)" };
  const v = raw[t.severityField];
  if (v === undefined || v === null) return { value:0, ok:false, note:"源字段缺失，0 (Unknown)" };
  const key = String(v).trim();
  for (const k in t.severityMap) {
    if (k.toLowerCase() === key.toLowerCase()) return { value:t.severityMap[k], ok:true, note:"「" + key + "」→ " + t.severityMap[k] };
  }
  const n = Number(key);
  if (!isNaN(n) && n >= 0 && n <= 6) return { value:n, ok:true, note:"已是 OCSF 档位" };
  return { value:0, ok:false, note:"未识别档位「" + key + "」，0 + warning" };
}
function mapSample(t, rawText) {
  const fmt = detectFormat(rawText);
  const enc = detectEncoding(rawText);
  if (fmt.format !== "JSON") {
    return { error:"该模板要求 JSON；探测到 " + fmt.format + "（" + fmt.note + "）", fmt:fmt, enc:enc };
  }
  let raw;
  try { raw = JSON.parse(rawText); } catch (e) { return { error:"样本不是合法 JSON", fmt:fmt, enc:enc }; }
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) return { error:"样本必须是 JSON 对象", fmt:fmt, enc:enc };

  const rows = [];
  const consumed = {};
  const event = {
    class_uid: t.classUid, category_uid: Math.floor(t.classUid / 1000),
    activity_id: 1, severity_id: 0, is_alert: t.kind === "detection", time: null, message: null,
    metadata: { product: { vendor_name: t.vendor, name: t.name }, version: t.version },
    unmapped: {}
  };

  const tm = parseTime(raw, t);
  event.time = tm.value; consumed[t.timeField] = true;
  rows.push({ src:t.timeField, dst:"time", ok:tm.ok, note:tm.note });

  const sv = parseSeverity(raw, t);
  event.severity_id = sv.value;
  if (t.severityField) consumed[t.severityField] = true;
  rows.push({ src:t.severityField || "（未声明）", dst:"severity_id", ok:sv.ok, note:sv.note });

  for (const src in t.fieldMap) {
    const dst = t.fieldMap[src];
    const value = getPath(raw, src);
    consumed[src.split(".")[0]] = true;
    if (value === undefined || value === null) {
      setPath(event, dst, null);
      rows.push({ src:src, dst:dst, ok:false, note:"源字段缺失，置 null" });
      continue;
    }
    const wantInt = /\.port$/.test(dst);
    setPath(event, dst, wantInt && isFinite(Number(value)) ? Number(value) : value);
    rows.push({ src:src, dst:dst, ok:true, note:wantInt ? "转 int" : "直映射" });
  }

  for (const c in t.constants) setPath(event, c, t.constants[c]);
  if (t.disposition && raw[t.disposition.field] !== undefined) {
    const mapped = t.disposition.map[String(raw[t.disposition.field])];
    event.disposition = mapped || null;
    consumed[t.disposition.field] = true;
    rows.push({ src:t.disposition.field, dst:"disposition",
      ok:Boolean(mapped), note:mapped ? "security_control：" + mapped : "未在映射表中，置 null" });
  }

  for (const k in raw) if (!consumed[k]) event.unmapped[k] = raw[k];

  const mapped = rows.filter(function (r) { return r.ok; }).length;
  const unmappedKeys = Object.keys(event.unmapped);
  return { event:event, rows:rows, mapped:mapped, total:rows.length, unmappedKeys:unmappedKeys,
           fmt:fmt, enc:enc, keyField:unmappedKeys.length ? "src_endpoint.ip" : "src_endpoint.ip",
           fill: rows.length ? mapped / rows.length : 0 };
}
function inheritanceChain(t) {
  const chain = [t];
  let cur = t;
  while (cur.extendsId) { cur = tpl(cur.extendsId); chain.unshift(cur); }
  return chain;
}

function defaultSample(t) {
  const s = {};
  s[t.timeField] = t.timeFormat === "unix_ms" ? 1762986541200 : "2026-11-12T20:31:04Z";
  if (t.severityField) {
    const keys = Object.keys(t.severityMap);
    s[t.severityField] = keys.length ? keys[0] : "high";
  }
  const srcs = Object.keys(t.fieldMap).slice(0, 5);
  srcs.forEach(function (k, i) {
    if (k === t.timeField || k === t.severityField) return;
    const dst = t.fieldMap[k];
    s[k] = /\.port$/.test(dst) ? 443 + i : (i === 0 ? "10.20.3.44" : "值-" + (i + 1));
  });
  s["extra_field"] = "该厂商独有，模板未映射";
  return JSON.stringify(s, null, 2);
}

function stepReady() {
  if (step === 0) return Boolean(draft.template);
  /* 验证通过，或显式选择通用回退（原文透传），两者其一即可前进。 */
  if (step === 1) return Boolean(draft.genericFallback || (verifyResult && !verifyResult.error));
  if (step === 2) return Boolean(draft.channel);
  if (step === 3) {
    if (!draft.name.trim()) return false;
    if (draft.channel === "syslog") {
      return !CONNECTORS.some(function (c) { return c.channel === "syslog" && c.cfg.port === draft.port; });
    }
    return true;
  }
  return true;
}

function openTemplate(t) {

    (t.experimental ? " · 实验性" : "");

  const chain = inheritanceChain(t);
  body.append(el("div", { class:"fieldset" },
    el("div", { class:"legend" }, "契约"),
    el("dl", { class:"panel" },
      el("div", { class:"panel-row" }, el("dt", {}, "id"), el("dd", { class:"mono" }, t.id)),
      el("div", { class:"panel-row" }, el("dt", {}, "kind"), el("dd", {}, t.kind + "（生产者声明，不靠 severity 推断）")),
      el("div", { class:"panel-row" }, el("dt", {}, "class_uid"), el("dd", { class:"mono" }, t.classUid + " " + t.className)),
      el("div", { class:"panel-row" }, el("dt", {}, "时间"), el("dd", { class:"mono" }, t.timeField + " · " + t.timeFormat)),
      el("div", { class:"panel-row" }, el("dt", {}, "severity"), el("dd", {},
        t.severityField ? t.severityField + " · " + Object.keys(t.severityMap).join("／") : "未声明（固定 0 Unknown）")),
      el("div", { class:"panel-row" }, el("dt", {}, "继承"), el("dd", { class:"mono" },
        chain.length > 1 ? chain.map(function (x) { return x.id; }).join(" → ") + "（逐键覆盖）" : "无")),
      el("div", { class:"panel-row" }, el("dt", {}, "disposition"), el("dd", {},
        t.disposition ? "security_control · " + t.disposition.field : "无（非阻断类）")),
      el("div", { class:"panel-row" }, el("dt", {}, "校验"), el("dd", {}, badge("ok", "通过") + " 加载时校验 class_uid 与 severity 值域")),
      el("div", { class:"panel-row" }, el("dt", {}, "覆盖率"), el("dd", {}, Math.round(t.coverage * 100) + "%（最近 24h 真实样本）")))));

  const map = el("table", { class:"map-table" });
  map.append(el("tr", {}, el("th", {}, "厂商字段"), el("th", {}, "OCSF 目标")));
  for (const src in t.fieldMap) map.append(el("tr", {}, el("td", { class:"map-src mono" }, src), el("td", { class:"mono" }, t.fieldMap[src])));
  body.append(el("div", { class:"fieldset" }, el("div", { class:"legend" }, "字段映射"), map));

  }
  showSheet($("#tplSheet"));
}
