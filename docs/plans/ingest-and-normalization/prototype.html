<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>数据源接入 · 原型 · SecPlexus</title>
<style>
  :root{--background:#fff;--foreground:#0a1317;--card:#fff;--primary:#0064e0;--primary-foreground:#fff;
    --secondary:#f1f4f7;--muted-foreground:#5d6c7b;--destructive:#e41e3f;--border:#dee3e9;--input:#ced0d4;
    --radius:.75rem;--success:#31a24c;--attention:#f2a918;--chart-1:#0064e0;--chart-4:#8a8a8a;--chart-5:#6b6b6b;--ring:#0064e0}
  @media (prefers-color-scheme:dark){:root{--background:#0a0a0a;--foreground:#fafafa;--card:#171717;
    --primary:#0091ff;--primary-foreground:#0a1317;--secondary:#262626;--muted-foreground:#a3a3a3;
    --destructive:#f0284a;--border:#262626;--input:#333;--chart-1:#0091ff;--chart-4:#a3a3a3;--chart-5:#d4d4d4;--ring:#0091ff}}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:Montserrat,"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    background:var(--background);color:var(--foreground);font-size:14px;line-height:1.5;letter-spacing:-.01em;
    -webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit}
  .shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
  .sidebar{border-right:1px solid var(--border);background:var(--card);padding:18px 14px;display:flex;
    flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:9px;padding:4px 8px}
  .brand-mark{width:26px;height:26px;border-radius:8px;background:var(--primary);color:var(--primary-foreground);
    display:grid;place-items:center;font-weight:700;font-size:13px}
  .brand-name{font-weight:600;letter-spacing:-.02em}
  .nav-group{display:flex;flex-direction:column;gap:2px}
  .nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-foreground);
    padding:0 8px 6px;font-weight:600}
  .nav-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:10px;
    color:var(--muted-foreground);text-decoration:none;font-size:13.5px}
  .nav-item:hover{background:var(--secondary);color:var(--foreground)}
  .nav-item[aria-current=page]{background:var(--secondary);color:var(--foreground);font-weight:600}
  .nav-item svg{width:16px;height:16px;opacity:.8;flex:none}
  .main{min-width:0}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;
    border-bottom:1px solid var(--border)}
  .crumbs{color:var(--muted-foreground);font-size:12.5px}
  .crumbs b{color:var(--foreground);font-weight:600}
  .avatar{width:28px;height:28px;border-radius:999px;background:var(--secondary);display:grid;
    place-items:center;font-size:12px;font-weight:600}
  .content{padding:26px 28px 60px;max-width:1240px}
  h1{font-size:20px;font-weight:600;margin:0 0 4px;letter-spacing:-.02em}
  .toolbar{display:flex;align-items:center;gap:8px;margin:20px 0 14px;flex-wrap:wrap}
  .toolbar .spacer{margin-left:auto}
  .input-group{display:flex;align-items:center;gap:7px;height:32px;padding:0 10px;
    border:1px solid var(--input);border-radius:999px;background:var(--card);min-width:250px}
  .input-group:focus-within{outline:2px solid var(--ring);outline-offset:1px}
  .input-group input{border:0;outline:0;background:transparent;width:100%;font-size:13px;color:var(--foreground)}
  .input-group svg{width:15px;height:15px;color:var(--muted-foreground);flex:none}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 14px;
    border-radius:999px;border:1px solid transparent;background:var(--primary);color:var(--primary-foreground);
    font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
  .btn:hover{opacity:.9}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn-outline{background:var(--card);border-color:var(--input);color:var(--foreground);font-weight:500}
  .btn-outline:hover{background:var(--secondary);opacity:1}
  .btn-danger{background:transparent;border-color:var(--input);color:var(--destructive)}
  .btn-sm{height:28px;padding:0 11px;font-size:12.5px}
  .btn svg{width:15px;height:15px}
  .table-card{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--card)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:left;font-weight:500;color:var(--muted-foreground);padding:10px 14px;
    border-bottom:1px solid var(--border);font-size:12px;white-space:nowrap}
  tbody td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--secondary)}
  .cell-name{font-weight:600}
  .cell-sub{color:var(--muted-foreground);font-size:12px;margin-top:2px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
  .dim{color:var(--muted-foreground)}
  .badge{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 9px;border-radius:999px;
    background:var(--secondary);color:var(--foreground);font-size:11.5px;font-weight:500;white-space:nowrap}
  .badge-dot{width:6px;height:6px;border-radius:999px;background:var(--muted-foreground)}
  .badge-ok .badge-dot{background:var(--success)}
  .badge-warn .badge-dot{background:var(--attention)}
  .badge-err .badge-dot{background:var(--destructive)}
  .badge-idle .badge-dot{background:var(--muted-foreground)}
  .badge-outline{background:transparent;border:1px solid var(--input)}
  .scrim{position:fixed;inset:0;background:rgba(10,19,23,.38);opacity:0;pointer-events:none;
    transition:opacity .18s;z-index:40}
  .scrim.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;top:0;right:0;height:100vh;width:min(920px,96vw);background:var(--card);
    border-left:1px solid var(--border);display:flex;flex-direction:column;transform:translateX(101%);
    transition:transform .22s cubic-bezier(.32,.72,0,1);z-index:41}
  .sheet.open{transform:none}
  .sheet-head{display:flex;align-items:flex-start;gap:12px;padding:16px 22px;border-bottom:1px solid var(--border)}
  .sheet-head h2{margin:0;font-size:15px;font-weight:600}
  .sheet-head p{margin:2px 0 0;font-size:12.5px;color:var(--muted-foreground)}
  .icon-btn{margin-left:auto;width:28px;height:28px;border-radius:999px;border:0;background:transparent;
    color:var(--muted-foreground);cursor:pointer;display:grid;place-items:center;flex:none}
  .icon-btn:hover{background:var(--secondary);color:var(--foreground)}
  .sheet-body{padding:20px 22px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:20px}
  .sheet-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px}
  .sheet-foot .spacer{margin-left:auto}
  .steps{display:flex;align-items:center;padding:0 22px;margin-top:4px}
  .step{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted-foreground);white-space:nowrap}
  .step-num{width:21px;height:21px;border-radius:999px;border:1px solid var(--input);display:grid;
    place-items:center;font-size:11px;font-weight:600;flex:none}
  .step.active{color:var(--foreground);font-weight:600}
  .step.active .step-num{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
  .step.done .step-num{background:var(--secondary);border-color:var(--input);color:var(--foreground)}
  .step-line{flex:1;height:1px;background:var(--border);margin:0 9px;min-width:12px}
  .option-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .option{text-align:left;border:1px solid var(--input);border-radius:var(--radius);background:var(--card);
    padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:7px}
  .option:hover{border-color:var(--muted-foreground)}
  .option[aria-pressed=true]{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary) inset}
  .option-top{display:flex;align-items:center;gap:8px}
  .option-icon{width:26px;height:26px;border-radius:8px;background:var(--secondary);display:grid;
    place-items:center;flex:none}
  .option-icon svg{width:15px;height:15px}
  .option-title{font-weight:600;font-size:13.5px}
  .option-desc{color:var(--muted-foreground);font-size:12px;line-height:1.45}
  .option[aria-pressed=true] .option-icon{background:var(--primary);color:var(--primary-foreground)}
  .fieldset{display:flex;flex-direction:column;gap:10px}
  .legend{font-size:12px;font-weight:600;color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.06em}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:12.5px;font-weight:500}
  .field input,.field textarea{height:34px;border-radius:10px;border:1px solid var(--input);background:var(--card);
    color:var(--foreground);padding:0 11px;font:inherit;font-size:13px}
  .field textarea{height:auto;padding:9px 11px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:11.5px;line-height:1.5;resize:vertical;min-height:96px}
  .field input:focus,.field textarea:focus{outline:2px solid var(--ring);outline-offset:1px}
  .field .hint{font-size:11.5px;color:var(--muted-foreground)}
  .template-list{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--radius);
    overflow:hidden;max-height:300px;overflow-y:auto}
  .template-row{display:flex;align-items:center;gap:10px;padding:10px 13px;border-bottom:1px solid var(--border);
    cursor:pointer;background:var(--card);text-align:left;width:100%;border-left:0;border-right:0;border-top:0}
  .template-row:last-child{border-bottom:0}
  .template-row:hover{background:var(--secondary)}
  .template-row[aria-pressed=true]{background:var(--secondary)}
  .template-row[aria-pressed=true] .tick{opacity:1}
  .tick{margin-left:auto;opacity:0;color:var(--primary);display:grid;place-items:center}
  .tick svg{width:16px;height:16px}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:8px 14px;font-size:13px;align-items:baseline}
  .kv dt{color:var(--muted-foreground);font-size:12.5px}
  .kv dd{margin:0}
  .code-box{display:flex;align-items:center;gap:8px;background:var(--secondary);border-radius:10px;
    padding:9px 11px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;
    word-break:break-all}
  .code-box .grow{flex:1}
  .copy{border:0;background:transparent;color:var(--muted-foreground);cursor:pointer;flex:none;
    display:grid;place-items:center}
  .copy:hover{color:var(--foreground)}
  .callout{display:flex;gap:10px;padding:11px 13px;border-radius:10px;background:var(--secondary);
    font-size:12.5px;line-height:1.5;align-items:flex-start}
  .callout svg{width:16px;height:16px;flex:none;margin-top:1px;color:var(--muted-foreground)}
  .callout-warn{background:color-mix(in srgb,var(--attention) 14%,var(--card))}
  .callout-warn svg{color:var(--attention)}
  .callout-ok{background:color-mix(in srgb,var(--success) 12%,var(--card))}
  .callout-ok svg{color:var(--success)}
  .callout-err{background:color-mix(in srgb,var(--destructive) 12%,var(--card))}
  .callout-err svg{color:var(--destructive)}
  pre.event{margin:0;padding:12px;border-radius:10px;background:var(--secondary);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.55;
    overflow:auto;max-height:300px;color:var(--foreground)}
  .ev-key{color:var(--chart-1)}
  .ev-num{color:var(--chart-5)}
  .ev-str{color:var(--success)}
  .ev-null{color:var(--muted-foreground)}
  .empty{padding:40px 20px;text-align:center;color:var(--muted-foreground);font-size:13px}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);padding:0 22px}
  .tab{border:0;background:transparent;padding:9px 12px;font-size:12.5px;color:var(--muted-foreground);
    cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
  .tab:hover{color:var(--foreground)}
  .tab[aria-selected=true]{color:var(--foreground);border-bottom-color:var(--primary);font-weight:600}
  .panel{border:1px solid var(--border);border-radius:var(--radius)}
  .panel-row{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:10px 13px;
    border-bottom:1px solid var(--border);font-size:12.5px}
  .panel-row:last-child{border-bottom:0}
  .panel-row dt{color:var(--muted-foreground);margin:0}
  .panel-row dd{margin:0}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .map-table{width:100%;border-collapse:collapse;font-size:12px}
  .map-table td{padding:5px 8px;border-bottom:1px solid var(--border)}
  .map-table tr:last-child td{border-bottom:0}
  .map-src{color:var(--muted-foreground)}
  .map-ok{color:var(--success)}
  .map-miss{color:var(--attention)}
  .quality{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .stat{border:1px solid var(--border);border-radius:var(--radius);padding:11px 13px}
  .stat-label{font-size:11.5px;color:var(--muted-foreground)}
  .stat-value{font-size:19px;font-weight:600;letter-spacing:-.02em;margin-top:3px}
  .stat-value small{font-size:11.5px;font-weight:500;color:var(--muted-foreground)}
  .bar{height:5px;border-radius:999px;background:var(--secondary);margin-top:8px;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:999px;background:var(--chart-1)}
  .stream{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--radius);
    overflow:hidden;font-size:12px}
  .stream-row{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:9px 12px;
    border-bottom:1px solid var(--border)}
  .stream-row:last-child{border-bottom:0}
  .stream-row.bad{background:color-mix(in srgb,var(--destructive) 8%,var(--card))}
  .stream-time{color:var(--muted-foreground);font-family:ui-monospace,Menlo,monospace}
  .stream-msg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{display:inline-block;padding:0 7px;height:18px;line-height:18px;border-radius:999px;
    background:var(--secondary);font-size:10.5px;font-weight:600;margin-left:6px}
  .pill-ok{color:var(--success)}
  .pill-bad{color:var(--destructive)}
  @media (max-width:900px){
    .shell{grid-template-columns:1fr}.sidebar{display:none}
    .option-grid{grid-template-columns:1fr}.quality{grid-template-columns:1fr 1fr}
    .two-col{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">S</span><span class="brand-name">SecPlexus</span></div>
    <nav class="nav-group" aria-label="主导航">
      <span class="nav-label">工作区</span>
      <a class="nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>工作台</a>
      <a class="nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M3 12h18"/></svg>事件</a>
      <a class="nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>审计日志</a>
    </nav>
    <nav class="nav-group" aria-label="设置导航">
      <span class="nav-label">设置</span>
      <a class="nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.3 3.1-6 7-6s7 2.7 7 6"/></svg>个人资料</a>
      <a class="nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 2.7-5.5 6-5.5S15 17 15 20"/><path d="M17 11h4M19 9v4"/></svg>用户管理</a>
      <a class="nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 3v6c0 4.2-2.9 7.5-7 9-4.1-1.5-7-4.8-7-9V6l7-3z"/></svg>角色与权限</a>
      <a class="nav-item" href="#" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h6l2 2h10v9a2 2 0 0 1-2 2H3z"/><path d="M3 7V6a2 2 0 0 1 2-2h4l2 2"/></svg>数据源</a>
    </nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="crumbs">设置 / <b>数据源</b></div>
      <div class="avatar" title="EayonLee">EL</div>
    </div>
    <div class="content">
      <h1>数据源</h1>
      <div id="banner"></div>
      <div class="toolbar">
        <div class="input-group">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="搜索名称、模板或 OCSF 类" aria-label="搜索名称、模板或 OCSF 类" />
        </div>
        <button class="btn btn-outline btn-sm" id="filterState">状态：全部</button>
        <span class="spacer"></span>
        <button class="btn" id="openWizard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          接入数据源
        </button>
      </div>
      <div class="table-card">
        <table>
          <thead><tr>
            <th style="width:24%">名称</th><th style="width:9%">通道</th><th style="width:22%">模板</th>
            <th style="width:23%">接入地址</th><th style="width:13%">状态</th><th style="width:9%">近 1 小时</th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<div class="scrim" id="scrim"></div>

<!-- 接入向导：通道 → 模板 → 绑定 → 样本验证 → 启动与诊断 -->
<section class="sheet" id="wizard" role="dialog" aria-modal="true" aria-labelledby="wizardTitle" aria-hidden="true">
  <div class="sheet-head">
    <div><h2 id="wizardTitle">接入数据源</h2><p id="wizardSub"></p></div>
    <button class="icon-btn" data-close aria-label="关闭"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="steps" id="steps"></div>
  <div class="sheet-body" id="wizardBody"></div>
  <div class="sheet-foot">
    <button class="btn btn-outline btn-sm" id="wizCancel">取消</button>
    <span class="spacer"></span>
    <button class="btn btn-outline btn-sm" id="wizPrev">上一步</button>
    <button class="btn btn-sm" id="wizNext">下一步</button>
  </div>
</section>

<!-- 诊断抽屉 -->
<section class="sheet" id="detail" role="dialog" aria-modal="true" aria-labelledby="detailTitle" aria-hidden="true">
  <div class="sheet-head">
    <div><h2 id="detailTitle">数据源</h2><p id="detailSub"></p></div>
    <button class="icon-btn" data-close aria-label="关闭"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="tabs" id="detailTabs" role="tablist">
    <button class="tab" role="tab" data-tab="overview" aria-selected="true">概览</button>
    <button class="tab" role="tab" data-tab="diagnose" aria-selected="false">诊断</button>
    <button class="tab" role="tab" data-tab="messages" aria-selected="false">收到的消息</button>
    <button class="tab" role="tab" data-tab="quality" aria-selected="false">映射质量</button>
  </div>
  <div class="sheet-body" id="detailBody"></div>
  <div class="sheet-foot">
    <button class="btn btn-danger btn-sm" id="detailDelete">删除数据源</button>
    <span class="spacer"></span>
    <button class="btn btn-outline btn-sm" id="detailToggle">停用</button>
    <button class="btn btn-sm" id="detailStart">启动</button>
  </div>
</section>

<script>

/* ------------------------------------------------------------------
   原型数据。字段形状对齐 spec 的 connectors 表与 OCSF 事件；
   模板带 field_map / severity_map / time 格式，用来演示"先验证后启用"。
   ------------------------------------------------------------------ */
const CHANNELS = {
  http:   { label: "HTTP",   icon: "cloud",  desc: "设备主动推送 JSON 或纯文本，凭 Bearer 令牌鉴权" },
  syslog: { label: "syslog", icon: "radio",  desc: "UDP 与 TCP 同端口接收，自动识别 RFC5424／3164／6587" },
  kafka:  { label: "Kafka",  icon: "layers", desc: "从客户已有总线消费，按模板反序列化" }

    else if (k === "text") n.textContent = v;
    else if (k.indexOf("on") === 0) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (let i = 2; i < arguments.length; i++) {
    const kids = Array.isArray(arguments[i]) ? arguments[i] : [arguments[i]];
    kids.forEach(function (kid) {
      if (kid === null || kid === undefined || kid === false) return;
      n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    });
  }
  return n;
}

/* ---------- 映射引擎（原型内的最小实现，用来证明流程可行） ---------- */
function getPath(obj, path) {
  const parts = String(path).split(".");
  let cur = obj;
  for (let i = 0; i < parts.length; i++) {
    if (cur === null || cur === undefined) return undefined;
    cur = cur[parts[i]];
  }
  return cur;
}
function setPath(obj, path, value) {
  const parts = String(path).split(".");
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    if (!cur[parts[i]] || typeof cur[parts[i]] !== "object") cur[parts[i]] = {};
    cur = cur[parts[i]];
  }
  cur[parts[parts.length - 1]] = value;
}
function parseTime(raw, tpl0) {
  const v = raw[tpl0.timeField];
  if (v === undefined || v === null || v === "") return { value:null, note:"时间字段缺失：" + tpl0.timeField + "，置 null 并记 warning" };
  if (tpl0.timeFormat === "unix_ms") {
    const n = Number(v);
    if (!isFinite(n) || n <= 0) return { value:null, note:"不是合法的毫秒时间戳「" + v + "」" };
    return { value:new Date(n).toISOString(), note:"unix_ms → ISO" };
  }
  const d = new Date(v);
  if (isNaN(d.getTime())) return { value:null, note:"不是合法的 RFC3339「" + v + "」" };
  return { value:d.toISOString(), note:"RFC3339 → ISO" };
}
function parseSeverity(raw, tpl0) {
  if (!tpl0.severityField) return { value:0, note:"模板未声明 severity 字段，按 0 (Unknown)" };
  const v = raw[tpl0.severityField];
  if (v === undefined || v === null) return { value:0, note:"源字段「" + tpl0.severityField + "」缺失，按 0 (Unknown)" };
  const key = String(v).trim();
  const lower = key.toLowerCase();
  for (const k in tpl0.severityMap) {
    if (k.toLowerCase() === lower) return { value:tpl0.severityMap[k], note:"「" + key + "」→ " + tpl0.severityMap[k] };
  }
  const n = Number(key);
  if (!isNaN(n) && n >= 0 && n <= 6) return { value:n, note:"已是 OCSF 档位" };
  return { value:0, note:"未识别的档位「" + key + "」，按 0 (Unknown) 并记 warning" };
}
function mapSample(tpl0, rawText) {
  let raw;
  try { raw = JSON.parse(rawText); }
  catch (e) { return { error:"样本不是合法 JSON：" + e.message.slice(0, 60) }; }
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) return { error:"样本必须是 JSON 对象" };

  const rows = [];
  const consumed = {};
  const event = {
    class_uid: tpl0.classUid,
    category_uid: Math.floor(tpl0.classUid / 1000),
    severity_id: 0,
    is_alert: tpl0.kind === "detection",
    time: null,
    message: null,
    metadata: { product: { vendor_name: tpl0.vendor, name: tpl0.name }, version: tpl0.version },
    unmapped: {}
  };

  const t = parseTime(raw, tpl0);
  event.time = t.value;
  consumed[tpl0.timeField] = true;
  rows.push({ src:tpl0.timeField, dst:"time", ok:t.value !== null, note:t.note });

  const sv = parseSeverity(raw, tpl0);
  event.severity_id = sv.value;
  if (tpl0.severityField) consumed[tpl0.severityField] = true;
  rows.push({ src:tpl0.severityField || "（未声明）", dst:"severity_id", ok:sv.value !== 0 || !tpl0.severityField, note:sv.note });

  const typeMap = { port:"int", int:"int" };
  for (const src in tpl0.fieldMap) {
    const dst = tpl0.fieldMap[src];
    const value = getPath(raw, src);
    consumed[src.split(".")[0]] = true;
    if (value === undefined || value === null) {
      rows.push({ src:src, dst:dst, ok:false, note:"源字段缺失，置 null" });
      setPath(event, dst, null);
      continue;
    }
    const want = typeMap[src] || null;
    const converted = want === "int" && isFinite(Number(value)) ? Number(value) : value;
    setPath(event, dst, converted);
    rows.push({ src:src, dst:dst, ok:true, note:want === "int" ? "转 int" : "直映射" });
  }

  for (const k in raw) {
    if (!consumed[k]) event.unmapped[k] = raw[k];
  }
  const unmappedKeys = Object.keys(event.unmapped);
  const mapped = rows.filter(function (r) { return r.ok; }).length;
  return { event:event, rows:rows, mapped:mapped, total:rows.length,
           unmappedKeys:unmappedKeys, fill: rows.length ? mapped / rows.length : 0 };
}

        codeBox("ing_live_" + Math.random().toString(16).slice(2, 10) + "d47b2e96c1a8d3b70e5f294c"),
        el("div", { class:"callout" }, el("span", { html:ICON.info }),
          "令牌只在创建时完整显示一次，之后只留摘要；可随时轮换。单源 50 次/秒、突发 200，单请求 10 MiB、单批 1000 条。")));
    }
    if (draft.channel === "syslog") {
      const listening = CONNECTORS.filter(function (c) { return c.channel === "syslog"; })
        .map(function (c) { return c.binding.split(":").pop(); });
      const conflict = listening.indexOf(draft.port) >= 0;
      body.append(el("div", { class:"fieldset" },
        el("div", { class:"legend" }, "监听端口"),
        el("div", { class:"field" },
          el("label", { for:"cnPort" }, "UDP 与 TCP 同端口"),
          el("input", { id:"cnPort", value:draft.port, oninput:function(e){ draft.port = e.target.value; },
            onchange:function(){ renderWizardBody(); } }),
          el("span", { class:"hint" }, "建议 1024 以上；绑定由服务端完成，报文内不读取任何身份字段")),
        conflict
          ? el("div", { class:"callout callout-err" }, el("span", { html:ICON.warn }),
              "端口 " + draft.port + " 已被其他数据源占用。一个端口只能绑一个数据源。")
          : el("div", { class:"callout callout-ok" }, el("span", { html:ICON.ok }),
              "端口 " + draft.port + " 可用（已探测本机监听与防火墙规则）。")));
    }
    if (draft.channel === "kafka") {
      body.append(el("div", { class:"fieldset" },
        el("div", { class:"legend" }, "消费来源"),
        el("div", { class:"field" }, el("label", { for:"cnBrokers" }, "Brokers"),
          el("input", { id:"cnBrokers", value:draft.brokers, oninput:function(e){ draft.brokers = e.target.value; } })),
        el("div", { class:"field" }, el("label", { for:"cnTopic" }, "Topic"),
          el("input", { id:"cnTopic", value:draft.topic, oninput:function(e){ draft.topic = e.target.value; } })),
        el("div", { class:"callout" }, el("span", { html:ICON.info }),
          "独立消费组 spx-ingestor-" + "{connector_id}；位移只在事件成功发布后才提交，重启会重放未确认部分。")));
    }
  }

  if (step === 3) {
    $("#wizardSub").textContent = "用一条真实样本先验证映射，再决定是否启用";
    const t = tpl(draft.template);
    const area = el("textarea", { id:"cnSample", oninput:function(e){ draft.sample = e.target.value; } });
    area.value = draft.sample || t.sample;

    const resultHost = el("div", { id:"verifyHost" });
    const btn = el("button", { id:"verifyBtn", class:"btn btn-outline btn-sm", onclick:function(){
      verifyResult = mapSample(t, area.value);
      renderWizardBody();
    } }, "验证映射");

    body.append(el("div", { class:"fieldset" },
      el("div", { class:"legend" }, "样本"),
      area,
      el("div", { style:"display:flex;gap:8px;align-items:center" }, btn,
        el("span", { class:"hint" }, "贴一条设备真实日志；也可以从最近收到的消息里取一条"))
    ));

    if (verifyResult) {
      if (verifyResult.error) {
        body.append(el("div", { class:"callout callout-err" }, el("span", { html:ICON.warn }), verifyResult.error));
      } else {
        const r = verifyResult;
        const mapTable = el("table", { class:"map-table" });
        r.rows.forEach(function (row) {
          mapTable.append(el("tr", {},
            el("td", { class:"map-src mono" }, row.src),
            el("td", { class:"mono" }, row.dst),
            el("td", { class:row.ok ? "map-ok" : "map-miss", style:"text-align:right;white-space:nowrap" },
              row.ok ? "✓ " : "! ", row.note)));
        });
        const unmapped = r.unmappedKeys.length
          ? el("div", { class:"callout callout-warn" }, el("span", { html:ICON.warn }),
              "未映射字段 " + r.unmappedKeys.length + " 个，会原样进 event.unmapped：" + r.unmappedKeys.join("、"))
          : el("div", { class:"callout callout-ok" }, el("span", { html:ICON.ok }), "全部源字段都已映射");

        body.append(el("div", { class:"fieldset" },
          el("div", { class:"legend" }, "验证结果 · 映射 " + r.mapped + "/" + r.total + " 字段"),
          el("div", { class:"two-col" },
            el("div", { class:"fieldset" }, el("span", { class:"hint" }, "解析出的 OCSF 事件"), jsonBlock(r.event)),
            el("div", { class:"fieldset" }, el("span", { class:"hint" }, "字段映射"), mapTable)),
          unmapped));
      }
    }
  }

  if (step === 4) {
    $("#wizardSub").textContent = "创建后默认不运行；确认诊断结论后再启动";
    const t = tpl(draft.template);
    const bindAddr = draft.channel === "syslog" ? "10.41.84.81:" + draft.port
      : draft.channel === "kafka" ? draft.brokers + " · topic " + draft.topic
      : "POST /api/v1/ingestor/ingest/{new}";
    const ok = verifyResult && !verifyResult.error;

    body.append(el("div", { class:"fieldset" },
      el("div", { class:"legend" }, "接入摘要"),
      el("dl", { class:"kv" },
        el("dt", {}, "名称"), el("dd", { style:"font-weight:600" }, draft.name || "未命名数据源"),
        el("dt", {}, "通道"), el("dd", {}, CHANNELS[draft.channel].label),
        el("dt", {}, "模板"), el("dd", {}, t.name + " · v" + t.version),
        el("dt", {}, "目标类"), el("dd", { class:"mono" }, "class_uid " + t.classUid + " (" + t.className + ")"),
        el("dt", {}, "接入地址"), el("dd", {}, codeBox(bindAddr)))));

    const diag = el("div", { class:"fieldset" }, el("div", { class:"legend" }, "启动前诊断"));
    diag.append(el("dl", { class:"panel" },
      el("div", { class:"panel-row" }, el("dt", {}, "绑定"), el("dd", {},
        draft.channel === "syslog" ? "10.41.84.81:" + draft.port + " · UDP+TCP" :
        draft.channel === "kafka" ? draft.brokers : "HTTP 路由已就绪")),
      el("div", { class:"panel-row" }, el("dt", {}, "实例"), el("dd", {}, "1 个实例待启动")),
      el("div", { class:"panel-row" }, el("dt", {}, "样本验证"), el("dd", {},
        ok ? "通过 · 映射 " + verifyResult.mapped + "/" + verifyResult.total : "未验证（可返回上一步执行）")),
      el("div", { class:"panel-row" }, el("dt", {}, "预期故障"), el("dd", { class:"dim" }, "未发现"))
    ));

    if (ok) {
      diag.append(el("div", { class:"callout callout-ok" }, el("span", { html:ICON.ok }),
        "可以创建。创建后处于「待启动」，启动才会真正绑定端口并计入接收流量。"));
    }
    body.append(diag);
    $("#wizNext").textContent = "创建（待启动）";
  }
  $("#wizNext").disabled = !stepReady();
}

function stepReady() {
  if (step === 0) return Boolean(draft.channel);
  if (step === 1) return Boolean(draft.template);
  if (step === 2) {
    if (!draft.name.trim()) return false;
    if (draft.channel === "syslog") {
      return !CONNECTORS.some(function (c) { return c.channel === "syslog" && c.binding.split(":").pop() === draft.port; });
    }
    return true;
  }
  if (step === 3) return Boolean(verifyResult && !verifyResult.error);
  return true;
}

$("#openWizard").addEventListener("click", function () {
  draft.channel = null; draft.template = null; draft.name = "";
  draft.port = "5514"; draft.topic = "soc.raw"; draft.brokers = "kafka.internal:9092";
  draft.sample = ""; verifyResult = null;
  step = 0; renderSteps(); renderWizardBody(); show($("#wizard"));
});
$("#wizCancel").addEventListener("click", hide);
$("#wizPrev").addEventListener("click", function () { if (step > 0) { step--; renderSteps(); renderWizardBody(); } });
$("#wizNext").addEventListener("click", function () {
  if (!stepReady()) return;
  if (step < 4) { step++; renderSteps(); renderWizardBody(); return; }
  const t = tpl(draft.template);
  const id = "cn_" + Math.random().toString(16).slice(2, 8);
  CONNECTORS.unshift({
    id:id, name:draft.name, channel:draft.channel, template:t.id,
    binding: draft.channel === "syslog" ? "10.41.84.81:" + draft.port
      : draft.channel === "kafka" ? draft.brokers + " · topic " + draft.topic
      : "/api/v1/ingestor/ingest/" + id,
    state:"draft", hourly:0, fill:t.coverage, quarantine:0, lastSeen:"从未", token:null
  });
  renderRows(); renderBanner(); hide();
});

/* ---------- 诊断抽屉 ---------- */
let current = null;
let currentTab = "overview";
const STREAM = [
  { t:"20:31:04", ok:true,  msg:"检测到 SQL 注入攻击 · 10.20.3.44 → 10.20.9.7:443" },
  { t:"20:31:02", ok:true,  msg:"Web 攻击被阻断 · 198.51.100.7 → 10.20.9.7:443" },
  { t:"20:30:58", ok:false, msg:"parquet: 期望 JSON，收到非 UTF-8 字节序列（隔离）" },
  { t:"20:30:55", ok:true,  msg:"域控账户非工作时段异常登录 · CN-SH-DC01" },
  { t:"20:30:51", ok:true,  msg:"端口扫描 · 10.20.8.12 → 10.20.9.0/24" },
  { t:"20:30:47", ok:false, msg:"severity 值「未知档位」无法识别，按 0 处理（隔离）" }
];

function openDetail(c) {
  current = c; currentTab = "overview";
  $("#detailTitle").textContent = c.name;
  $("#detailSub").textContent = c.id + " · " + CHANNELS[c.channel].label + " · " + tpl(c.template).name;
  $$("#detailTabs .tab").forEach(function (b) { b.setAttribute("aria-selected", String(b.dataset.tab === "overview")); });
  renderDetail();
  show($("#detail"));
}
$$("#detailTabs .tab").forEach(function (b) {
  b.addEventListener("click", function () {
    currentTab = b.dataset.tab;
    $$("#detailTabs .tab").forEach(function (x) { x.setAttribute("aria-selected", String(x === b)); });
    renderDetail();
  });
});

function renderDetail() {
  const c = current;
  if (!c) return;
  const t = tpl(c.template);
  const body = $("#detailBody");
  body.replaceChildren();
  $("#detailToggle").style.display = c.state === "running" || c.state === "silent" ? "" : "none";
  $("#detailStart").style.display = c.state === "running" || c.state === "silent" ? "none" : "";

  if (currentTab === "overview") {
    const rows = [["接入地址", codeBox(c.binding)], ["通道", CHANNELS[c.channel].label],
      ["模板", t.name + " · v" + t.version + " · " + t.vendor],
      ["目标类", "class_uid " + t.classUid + " (" + t.className + ") · " + t.kind],
      ["状态", stateBadge(c.state)], ["最近收到", c.lastSeen]];
    if (c.channel === "http" && c.token) {
      const rotate = el("button", { class:"btn btn-outline btn-sm", onclick:function(){
        c.token = "ing_live_" + Math.random().toString(16).slice(2,10) + "c1a8d3b70e5f294c";
        renderDetail();
      } }, "轮换令牌");
      rows.push(["令牌", el("div", { class:"fieldset", style:"gap:8px" }, codeBox(c.token), rotate)]);
    }
    const dl = el("dl", { class:"kv" });
    rows.forEach(function (r) { dl.append(el("dt", {}, r[0]), el("dd", {}, r[1])); });
    body.append(el("div", { class:"fieldset" }, el("div", { class:"legend" }, "接入信息"), dl));
    if (c.channel === "http") {
      body.append(el("div", { class:"callout" }, el("span", { html:ICON.info }),
        "推送示例：curl -H \"Authorization: Bearer <令牌>\" -H \"Content-Type: application/json\" --data @sample.json " +
        "https://<host>" + c.binding));
    }
  }

  if (currentTab === "diagnose") {
    const trafficOk = c.state === "running";
    body.append(el("dl", { class:"panel" },
      el("div", { class:"panel-row" }, el("dt", {}, "信息"), el("dd", {},
        "type=" + CHANNELS[c.channel].label + " · bind=" + c.binding + " · node=ingestor-1")),
      el("div", { class:"panel-row" }, el("dt", {}, "状态"), el("dd", {},
        c.state === "draft" ? "尚未启动，未占用端口" :
        c.state === "stopped" ? "已停止；端口已释放" :
        c.state === "silent" ? "进程运行中，但 15 分钟内未观察到入站流量" : "运行中")),
      el("div", { class:"panel-row" }, el("dt", {}, "收到流量"), el("dd", {},
        trafficOk ? "18,432 条 / 小时 · 最近 2 秒前" : "0 条 · 最近 17 分钟前（异常）")),
      el("div", { class:"panel-row" }, el("dt", {}, "处理错误"), el("dd", {},
        c.quarantine > 0 ? c.quarantine.toFixed(1) + "% 进入隔离区（近 1 小时 3 条）" : "无")),
      el("div", { class:"panel-row" }, el("dt", {}, "实例"), el("dd", {}, "ingestor-1：正常"))
    ));

    const fixes = [];
    if (c.state === "silent") {
      fixes.push("确认设备侧目标地址填的是 " + c.binding + "，不是前端代理地址");
      fixes.push("若中间有 rsyslog 中继，源 IP 会变成中继地址；归属只按端口判定，不受影响");
    }
    if (c.quarantine > 2) fixes.push("隔离区占比 " + c.quarantine.toFixed(1) + "%，检查模板 severity_map 是否缺档位");
    if (c.state === "draft") fixes.push("创建后需要手动启动，启动才会绑定端口");
    if (!fixes.length) fixes.push("未发现需要处理的项");

    body.append(el("div", { class:"fieldset" },
      el("div", { class:"legend" }, "建议"),
      el("ul", { style:"margin:0;padding-left:18px;font-size:12.5px;color:var(--muted-foreground);line-height:1.7" },
        fixes.map(function (f) { return el("li", {}, f); }))));
  }

  if (currentTab === "messages") {
    const host = el("div", { class:"stream" });
    if (c.state === "draft" || c.state === "stopped") {
      host.append(el("div", { class:"empty" }, "未启动，暂无消息"));
    } else {
      STREAM.forEach(function (m) {
        host.append(el("div", { class:"stream-row" + (m.ok ? "" : " bad") },
          el("span", { class:"stream-time" }, m.t),
          el("div", { style:"min-width:0" },
            el("div", { class:"stream-msg" }, m.msg),
            el("span", { class:"pill " + (m.ok ? "pill-ok" : "pill-bad") }, m.ok ? "已发布" : "隔离"))));
      });
    }
    body.append(el("div", { class:"fieldset" },
      el("div", { class:"legend" }, "最近收到的消息（原始 → 解析结果）"), host));
  }

  if (currentTab === "quality") {
    body.append(el("div", { class:"fieldset" },
      el("div", { class:"legend" }, "映射质量 · 最近 24 小时"),
      el("div", { class:"quality" },
        el("div", { class:"stat" },
          el("div", { class:"stat-label" }, "填充率"),
          el("div", { class:"stat-value" }, (c.fill * 100).toFixed(1), el("small", {}, "%")),
          el("div", { class:"bar" }, el("i", { style:"width:" + (c.fill * 100) + "%" }))),
        el("div", { class:"stat" },
          el("div", { class:"stat-label" }, "事件量"),
          el("div", { class:"stat-value" }, c.hourly.toLocaleString("zh-CN"))),
        el("div", { class:"stat" },
          el("div", { class:"stat-label" }, "隔离区"),
          el("div", { class:"stat-value" }, c.quarantine.toFixed(1), el("small", {}, "%")),
          el("div", { class:"bar" }, el("i", { style:"width:" + Math.min(c.quarantine * 8, 100) + "%;background:var(--chart-4)" }))),
        el("div", { class:"stat" },
          el("div", { class:"stat-label" }, "未映射字段"),
          el("div", { class:"stat-value" }, "2")))));

    body.append(el("div", { class:"fieldset" },
      el("div", { class:"legend" }, "未映射最多的字段"),
      el("table", { class:"map-table" },
        el("tr", {}, el("td", { class:"map-src mono" }, "policy_id"), el("td", { style:"text-align:right" }, "100%")),
        el("tr", {}, el("td", { class:"map-src mono" }, "rule_level"), el("td", { style:"text-align:right" }, "98%")),
        el("tr", {}, el("td", { class:"map-src mono" }, "sessionid"), el("td", { style:"text-align:right" }, "42%"))),
      el("div", { class:"callout" }, el("span", { html:ICON.info }),
        "未映射字段不丢弃，原样写入 event.unmapped；下游可据此提出模板补充。")));
  }
}
$("#detailToggle").addEventListener("click", function () {
  if (!current) return;
  current.state = current.state === "running" ? "stopped" : "stopped";
  current.lastSeen = "刚刚";
  renderDetail(); renderRows(); renderBanner();
});
$("#detailStart").addEventListener("click", function () {
  if (!current) return;
  current.state = "running"; current.lastSeen = "2 秒前";
  renderDetail(); renderRows(); renderBanner();
});
$("#detailDelete").addEventListener("click", function () {
  if (!current) return;
  CONNECTORS = CONNECTORS.filter(function (x) { return x.id !== current.id; });
  hide(); renderRows(); renderBanner();
});

renderRows();
renderBanner();

</script>
