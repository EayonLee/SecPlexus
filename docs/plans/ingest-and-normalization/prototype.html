<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>数据源接入 · 原型 · SecPlexus</title>
<style>
  /* 设计令牌取自 DESIGN.md 的 SecPlexus Implementation Mapping：只换值，不换名。 */
  :root{--background:#fff;--foreground:#0a1317;--card:#fff;--primary:#0064e0;--primary-foreground:#fff;
    --secondary:#f1f4f7;--muted-foreground:#5d6c7b;--destructive:#e41e3f;--border:#dee3e9;--input:#ced0d4;
    --radius:.75rem;--success:#31a24c;--attention:#f2a918;--chart-1:#0064e0;--chart-4:#8a8a8a;--chart-5:#6b6b6b;--ring:#0064e0}
  @media (prefers-color-scheme:dark){:root{--background:#0a0a0a;--foreground:#fafafa;--card:#171717;
    --primary:#0091ff;--primary-foreground:#0a1317;--secondary:#262626;--muted-foreground:#a3a3a3;
    --destructive:#f0284a;--border:#262626;--input:#333;--chart-1:#0091ff;--chart-4:#a3a3a3;--chart-5:#d4d4d4;--ring:#0091ff}}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:Montserrat,"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    background:var(--background);color:var(--foreground);font-size:14px;line-height:1.5;letter-spacing:-.01em;
    -webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit}
  .shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
  .sidebar{border-right:1px solid var(--border);background:var(--card);padding:18px 14px;display:flex;
    flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:9px;padding:4px 8px}
  .brand-mark{width:26px;height:26px;border-radius:8px;background:var(--primary);color:var(--primary-foreground);
    display:grid;place-items:center;font-weight:700;font-size:13px}
  .brand-name{font-weight:600;letter-spacing:-.02em}
  .nav-group{display:flex;flex-direction:column;gap:2px}
  .nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-foreground);
    padding:0 8px 6px;font-weight:600}
  .nav-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:10px;
    color:var(--muted-foreground);text-decoration:none;font-size:13.5px;transition:background .12s,color .12s}
  .nav-item:hover{background:var(--secondary);color:var(--foreground)}
  .nav-item[aria-current=page]{background:var(--secondary);color:var(--foreground);font-weight:600}
  .nav-item svg{width:16px;height:16px;opacity:.8;flex:none}
  .main{min-width:0}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;
    border-bottom:1px solid var(--border)}
  .crumbs{color:var(--muted-foreground);font-size:12.5px}
  .crumbs b{color:var(--foreground);font-weight:600}
  .avatar{width:28px;height:28px;border-radius:999px;background:var(--secondary);display:grid;
    place-items:center;font-size:12px;font-weight:600}
  .content{padding:26px 28px 60px;max-width:1180px}
  h1{font-size:20px;font-weight:600;margin:0 0 4px;letter-spacing:-.02em}
  .toolbar{display:flex;align-items:center;gap:8px;margin:20px 0 14px;flex-wrap:wrap}
  .toolbar .spacer{margin-left:auto}
  .input-group{display:flex;align-items:center;gap:7px;height:32px;padding:0 10px;
    border:1px solid var(--input);border-radius:999px;background:var(--card);min-width:250px}
  .input-group:focus-within{outline:2px solid var(--ring);outline-offset:1px}
  .input-group input{border:0;outline:0;background:transparent;width:100%;font-size:13px;color:var(--foreground)}
  .input-group svg{width:15px;height:15px;color:var(--muted-foreground);flex:none}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 14px;
    border-radius:999px;border:1px solid transparent;background:var(--primary);color:var(--primary-foreground);
    font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:opacity .12s,background .12s}
  .btn:hover{opacity:.9}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn-outline{background:var(--card);border-color:var(--input);color:var(--foreground);font-weight:500}
  .btn-outline:hover{background:var(--secondary);opacity:1}
  .btn-danger{background:transparent;border-color:var(--input);color:var(--destructive)}
  .btn-sm{height:28px;padding:0 11px;font-size:12.5px}
  .btn svg{width:15px;height:15px}
  .table-card{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--card)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:left;font-weight:500;color:var(--muted-foreground);padding:10px 14px;
    border-bottom:1px solid var(--border);font-size:12px;white-space:nowrap}
  tbody td{padding:13px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  tbody tr{cursor:pointer;transition:background .1s}
  tbody tr:hover{background:var(--secondary)}
  .cell-name{font-weight:600}
  .cell-sub{color:var(--muted-foreground);font-size:12px;margin-top:2px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
  .dim{color:var(--muted-foreground)}
  .badge{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 9px;border-radius:999px;
    background:var(--secondary);color:var(--foreground);font-size:11.5px;font-weight:500;white-space:nowrap}
  .badge-dot{width:6px;height:6px;border-radius:999px;background:var(--muted-foreground)}
  .badge-ok .badge-dot{background:var(--success)}
  .badge-paused .badge-dot{background:var(--attention)}
  .badge-outline{background:transparent;border:1px solid var(--input)}
  .scrim{position:fixed;inset:0;background:rgba(10,19,23,.38);opacity:0;pointer-events:none;
    transition:opacity .18s;z-index:40}
  .scrim.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;top:0;right:0;height:100vh;width:min(780px,94vw);background:var(--card);
    border-left:1px solid var(--border);display:flex;flex-direction:column;transform:translateX(101%);
    transition:transform .22s cubic-bezier(.32,.72,0,1);z-index:41}
  .sheet.open{transform:none}
  .sheet-head{display:flex;align-items:flex-start;gap:12px;padding:16px 22px;border-bottom:1px solid var(--border)}
  .sheet-head h2{margin:0;font-size:15px;font-weight:600}
  .sheet-head p{margin:2px 0 0;font-size:12.5px;color:var(--muted-foreground)}
  .icon-btn{margin-left:auto;width:28px;height:28px;border-radius:999px;border:0;background:transparent;
    color:var(--muted-foreground);cursor:pointer;display:grid;place-items:center;flex:none}
  .icon-btn:hover{background:var(--secondary);color:var(--foreground)}
  .sheet-body{padding:20px 22px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:22px}
  .sheet-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px}
  .sheet-foot .spacer{margin-left:auto}
  .steps{display:flex;align-items:center;padding:0 22px;margin-top:4px}
  .step{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted-foreground)}
  .step-num{width:22px;height:22px;border-radius:999px;border:1px solid var(--input);display:grid;
    place-items:center;font-size:11.5px;font-weight:600;flex:none}
  .step.active{color:var(--foreground);font-weight:600}
  .step.active .step-num{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
  .step.done .step-num{background:var(--secondary);border-color:var(--input);color:var(--foreground)}
  .step-line{flex:1;height:1px;background:var(--border);margin:0 12px;min-width:18px}
  .option-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .option{text-align:left;border:1px solid var(--input);border-radius:var(--radius);background:var(--card);
    padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:7px;transition:border-color .12s}
  .option:hover{border-color:var(--muted-foreground)}
  .option[aria-pressed=true]{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary) inset}
  .option-top{display:flex;align-items:center;gap:8px}
  .option-icon{width:26px;height:26px;border-radius:8px;background:var(--secondary);display:grid;
    place-items:center;flex:none}
  .option-icon svg{width:15px;height:15px}
  .option-title{font-weight:600;font-size:13.5px}
  .option-desc{color:var(--muted-foreground);font-size:12px;line-height:1.45}
  .option[aria-pressed=true] .option-icon{background:var(--primary);color:var(--primary-foreground)}
  .fieldset{display:flex;flex-direction:column;gap:10px}
  .legend{font-size:12px;font-weight:600;color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.06em}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:12.5px;font-weight:500}
  .field input{height:34px;border-radius:10px;border:1px solid var(--input);background:var(--card);
    color:var(--foreground);padding:0 11px;font:inherit;font-size:13px}
  .field input:focus{outline:2px solid var(--ring);outline-offset:1px}
  .field .hint{font-size:11.5px;color:var(--muted-foreground)}
  .template-list{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--radius);
    overflow:hidden;max-height:320px;overflow-y:auto}
  .template-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--border);
    cursor:pointer;background:var(--card);text-align:left;width:100%;border-left:0;border-right:0;border-top:0}
  .template-row:last-child{border-bottom:0}
  .template-row:hover{background:var(--secondary)}
  .template-row[aria-pressed=true]{background:var(--secondary)}
  .template-row[aria-pressed=true] .tick{opacity:1}
  .tick{margin-left:auto;opacity:0;color:var(--primary);display:grid;place-items:center}
  .tick svg{width:16px;height:16px}
  .kv{display:grid;grid-template-columns:132px 1fr;gap:9px 16px;font-size:13px;align-items:baseline}
  .kv dt{color:var(--muted-foreground);font-size:12.5px}
  .kv dd{margin:0}
  .code-box{display:flex;align-items:center;gap:8px;background:var(--secondary);border-radius:10px;
    padding:9px 11px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;
    word-break:break-all}
  .code-box .grow{flex:1}
  .copy{border:0;background:transparent;color:var(--muted-foreground);cursor:pointer;flex:none;
    display:grid;place-items:center}
  .copy:hover{color:var(--foreground)}
  .callout{display:flex;gap:10px;padding:11px 13px;border-radius:10px;background:var(--secondary);
    font-size:12.5px;line-height:1.5;align-items:flex-start}
  .callout svg{width:16px;height:16px;flex:none;margin-top:1px;color:var(--muted-foreground)}
  .callout-warn{background:color-mix(in srgb,var(--attention) 14%,var(--card))}
  .callout-warn svg{color:var(--attention)}
  .callout-ok{background:color-mix(in srgb,var(--success) 12%,var(--card))}
  .callout-ok svg{color:var(--success)}
  .check-step{display:flex;align-items:center;gap:10px;font-size:13px;padding:7px 0}
  .check-step .spinner{width:14px;height:14px;border-radius:999px;flex:none;border:2px solid var(--border);
    border-top-color:var(--primary);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .check-icon{width:16px;height:16px;flex:none;display:grid;place-items:center}
  .check-step.pending{color:var(--muted-foreground)}
  pre.event{margin:0;padding:13px;border-radius:10px;background:var(--secondary);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.55;
    overflow:auto;max-height:340px;color:var(--foreground)}
  .ev-key{color:var(--chart-1)}
  .ev-num{color:var(--chart-5)}
  .ev-str{color:var(--success)}
  .ev-null{color:var(--muted-foreground)}
  .empty{padding:44px 20px;text-align:center;color:var(--muted-foreground);font-size:13px}
  .quality{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .stat{border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
  .stat-label{font-size:11.5px;color:var(--muted-foreground)}
  .stat-value{font-size:20px;font-weight:600;letter-spacing:-.02em;margin-top:3px}
  .stat-value small{font-size:12px;font-weight:500;color:var(--muted-foreground)}
  .bar{height:5px;border-radius:999px;background:var(--secondary);margin-top:9px;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:999px;background:var(--chart-1)}
  @media (max-width:900px){.shell{grid-template-columns:1fr}.sidebar{display:none}
    .option-grid{grid-template-columns:1fr}.quality{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">S</span><span class="brand-name">SecPlexus</span></div>
    <nav class="nav-group" aria-label="主导航">
      <span class="nav-label">工作区</span>

      <a class="nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M3 12h18"/></svg>事件</a>

    </nav>
    <nav class="nav-group" aria-label="设置导航">
      <span class="nav-label">设置</span>
      <a class="nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.3 3.1-6 7-6s7 2.7 7 6"/></svg>个人资料</a>
      <a class="nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 2.7-5.5 6-5.5S15 17 15 20"/><path d="M17 11h4M19 9v4"/></svg>用户管理</a>
      <a class="nav-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 3v6c0 4.2-2.9 7.5-7 9-4.1-1.5-7-4.8-7-9V6l7-3z"/></svg>角色与权限</a>
      <a class="nav-item" href="#" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h6l2 2h10v9a2 2 0 0 1-2 2H3z"/><path d="M3 7V6a2 2 0 0 1 2-2h4l2 2"/></svg>数据源</a>
    </nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="crumbs">设置 / <b>数据源</b></div>
      <div class="avatar" title="EayonLee">EL</div>
    </div>
    <div class="content">
      <h1>数据源</h1>
      <div class="toolbar">
        <div class="input-group">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="搜索数据源名称或模板" aria-label="搜索数据源名称或模板" />
        </div>
        <button class="btn btn-outline btn-sm" id="filterChannel">通道：全部</button>
        <span class="spacer"></span>
        <button class="btn" id="openWizard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          接入数据源
        </button>
      </div>
      <div class="table-card">
        <table>
          <thead><tr>
            <th style="width:26%">名称</th><th style="width:10%">通道</th><th style="width:24%">模板</th>
            <th style="width:26%">接入地址</th><th style="width:8%">状态</th><th style="width:6%">近 1 小时</th>

        </table>
      </div>
    </div>
  </main>
</div>

<div class="scrim" id="scrim"></div>

<section class="sheet" id="wizard" role="dialog" aria-modal="true" aria-labelledby="wizardTitle" aria-hidden="true">
  <div class="sheet-head">
    <div><h2 id="wizardTitle">接入数据源</h2><p id="wizardSub">选择通道，绑定模板，拿到接入地址</p></div>
    <button class="icon-btn" data-close aria-label="关闭"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="steps" id="steps"></div>
  <div class="sheet-body" id="wizardBody"></div>
  <div class="sheet-foot">
    <button class="btn btn-outline btn-sm" id="wizCancel">取消</button>
    <span class="spacer"></span>
    <button class="btn btn-outline btn-sm" id="wizPrev">上一步</button>
    <button class="btn btn-sm" id="wizNext">下一步</button>
  </div>
</section>

<section class="sheet" id="detail" role="dialog" aria-modal="true" aria-labelledby="detailTitle" aria-hidden="true">
  <div class="sheet-head">
    <div><h2 id="detailTitle">数据源</h2><p id="detailSub"></p></div>
    <button class="icon-btn" data-close aria-label="关闭"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="sheet-body" id="detailBody"></div>
  <div class="sheet-foot">
    <button class="btn btn-danger btn-sm" id="detailDelete">删除数据源</button>
    <span class="spacer"></span>
    <button class="btn btn-outline btn-sm" id="detailPause">停用</button>
    <button class="btn btn-sm" id="detailRecheck">重新自检</button>
  </div>
</section>

<script>

/* ------------------------------------------------------------------
   原型数据：形状与 spec 的 connectors 表、OCSF 事件一致。
   ------------------------------------------------------------------ */
const CHANNELS = {
  http:   { label: "HTTP",   icon: "cloud",  desc: "设备主动推送 JSON 或纯文本，凭 Bearer 令牌鉴权" },
  syslog: { label: "syslog", icon: "radio",  desc: "UDP 与 TCP 同端口接收，自动识别 RFC5424／3164／6587" },
  kafka:  { label: "Kafka",  icon: "layers", desc: "从客户已有总线消费，按模板反序列化" }
};

const TEMPLATES = [
  { id: "sangfor-af",         vendor: "深信服",     name: "AF 下一代防火墙", kind: "detection", class: 2004, experimental: false },
  { id: "sangfor-sip",        vendor: "深信服",     name: "SIP 态势感知",    kind: "detection", class: 2004, experimental: true  },
  { id: "qianxin-tianqing",   vendor: "奇安信",     name: "天擎终端",        kind: "detection", class: 2004, experimental: false },
  { id: "venus-ids",          vendor: "启明星辰",   name: "IDS 入侵检测",    kind: "detection", class: 2004, experimental: false },
  { id: "nsfocus-ids",        vendor: "绿盟",       name: "IDS 入侵检测",    kind: "detection", class: 2004, experimental: true  },
  { id: "hillstone-ngfw",     vendor: "山石网科",   name: "NGFW 防火墙",     kind: "telemetry", class: 4001, experimental: false },
  { id: "paloalto-traffic",   vendor: "Palo Alto",  name: "PAN-OS 流量",     kind: "telemetry", class: 4001, experimental: false },
  { id: "fortinet-fortigate", vendor: "Fortinet",   name: "FortiGate",       kind: "detection", class: 2004, experimental: false },
  { id: "crowdstrike-falcon", vendor: "CrowdStrike",name: "Falcon 终端",     kind: "detection", class: 2004, experimental: false },
  { id: "aws-cloudtrail",     vendor: "AWS",        name: "CloudTrail",      kind: "telemetry", class: 3002, experimental: false },
  { id: "aliyun-actiontrail", vendor: "阿里云",     name: "操作审计",        kind: "telemetry", class: 3002, experimental: true  },
  { id: "generic-json",       vendor: "通用",       name: "JSON 键值直映射", kind: "telemetry", class: 6003, experimental: false }
];

let CONNECTORS = [
  { id: "cn_7f21a9", name: "边界防火墙", channel: "syslog", template: "sangfor-af",
    binding: "10.41.84.81:5514", status: "active", hourly: 18432, fill: 0.97, quarantine: 0.4 },
  { id: "cn_2b83c1", name: "终端 EDR", channel: "http", template: "qianxin-tianqing",
    binding: "/api/v1/ingestor/ingest/cn_2b83c1", status: "active", hourly: 8421, fill: 0.93, quarantine: 1.2 },
  { id: "cn_5d90ee", name: "云审计推送", channel: "http", template: "aws-cloudtrail",
    binding: "/api/v1/ingestor/ingest/cn_5d90ee", status: "paused", hourly: 0, fill: 0.99, quarantine: 0 },
  { id: "cn_11c4a7", name: "SOC 总线", channel: "kafka", template: "paloalto-traffic",
    binding: "kafka.internal:9092 · topic soc.raw", status: "active", hourly: 4210, fill: 0.88, quarantine: 3.6 }
];

/* ---------- 小工具 ---------- */
const $ = (s, r) => (r || document).querySelector(s);
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const k in (attrs || {})) {
    const v = attrs[k];
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k.indexOf("on") === 0) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  kids.flat().forEach(function (kid) {
    if (kid === null || kid === undefined) return;
    n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  });
  return n;
}
const ICON = {
  cloud: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 18a4 4 0 0 1 0-8 6 6 0 0 1 11.4 1.4A3.5 3.5 0 0 1 18 18z"/></svg>',
  radio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="2"/><path d="M8 8a5.7 5.7 0 0 0 0 8M16 8a5.7 5.7 0 0 1 0 8M5 5a9.9 9.9 0 0 0 0 14M19 5a9.9 9.9 0 0 1 0 14"/></svg>',
  layers: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>',
  copy: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l9 16H3l9-16z"/><path d="M12 10v4M12 17h.01"/></svg>',
  ok:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>'
};
function badge(kind, text) {
  return el("span", { class: "badge badge-" + kind }, el("span", { class: "badge-dot" }), text);
}
function channelBadge(c) { return el("span", { class: "badge badge-outline" }, CHANNELS[c].label); }

function copyToClipboard(text, btn) {
  if (navigator.clipboard) navigator.clipboard.writeText(text).catch(function () {});
  const old = btn.innerHTML;
  btn.innerHTML = ICON.check;
  setTimeout(function () { btn.innerHTML = old; }, 1200);
}
function codeBox(text) {
  const btn = el("button", { class: "copy", "aria-label": "复制", html: ICON.copy });
  btn.addEventListener("click", function (e) { e.stopPropagation(); copyToClipboard(text, btn); });
  return el("div", { class: "code-box" }, el("span", { class: "grow" }, text), btn);
}
function tpl(id) {
  for (let i = 0; i < TEMPLATES.length; i++) if (TEMPLATES[i].id === id) return TEMPLATES[i];
  return TEMPLATES[0];
}

/* ---------- 列表 ---------- */
let channelFilter = "all";
function renderRows() {
  const q = $("#search").value.trim().toLowerCase();
  const rows = CONNECTORS.filter(function (c) {
    const t = tpl(c.template);
    const hay = (c.name + " " + t.vendor + " " + t.name + " " + c.id).toLowerCase();
    return (channelFilter === "all" || c.channel === channelFilter) && (!q || hay.indexOf(q) >= 0);
  });
  const body = $("#rows");
  body.replaceChildren();
  if (!rows.length) {
    body.append(el("tr", {}, el("td", { colspan: "6" }, el("div", { class: "empty" }, "没有匹配的数据源"))));
    return;
  }
  rows.forEach(function (c) {
    const t = tpl(c.template);
    const tr = el("tr", { onclick: function () { openDetail(c); } },
      el("td", {}, el("div", { class: "cell-name" }, c.name), el("div", { class: "mono cell-sub" }, c.id)),
      el("td", {}, channelBadge(c.channel)),
      el("td", {},
        el("div", {}, t.name),
        el("div", { class: "cell-sub" }, t.vendor, t.experimental ? el("span", { class: "dim" }, " · 实验性") : null)),
      el("td", {}, el("span", { class: "mono dim" }, c.binding)),
      el("td", {}, c.status === "active" ? badge("ok", "启用") : badge("paused", "停用")),
      el("td", { class: "mono dim" }, c.hourly.toLocaleString("zh-CN")));
    body.append(tr);
  });
}
$("#search").addEventListener("input", renderRows);
$("#filterChannel").addEventListener("click", function () {
  const order = ["all", "http", "syslog", "kafka"];
  channelFilter = order[(order.indexOf(channelFilter) + 1) % order.length];
  $("#filterChannel").textContent = "通道：" + (channelFilter === "all" ? "全部" : CHANNELS[channelFilter].label);
  renderRows();
});
renderRows();

/* ---------- 抽屉 ---------- */
let openSheet = null;
function show(sheet) {
  $("#scrim").classList.add("open");
  sheet.classList.add("open");
  sheet.setAttribute("aria-hidden", "false");
  openSheet = sheet;
}
function hide() {
  $("#scrim").classList.remove("open");
  ["#wizard", "#detail"].forEach(function (s) {
    const n = $(s);
    n.classList.remove("open");
    n.setAttribute("aria-hidden", "true");
  });
  openSheet = null;
}
$("#scrim").addEventListener("click", hide);
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && openSheet) hide(); });
document.querySelectorAll("[data-close]").forEach(function (b) { b.addEventListener("click", hide); });

/* ---------- 向导 ---------- */
const STEP_TITLES = ["通道", "模板", "绑定", "自检"];
let step = 0;
let checkState = "idle";
const draft = { channel: null, template: null, name: "", port: "5514", topic: "soc.raw", brokers: "kafka.internal:9092" };

function renderSteps() {
  const host = $("#steps");
  host.replaceChildren();
  STEP_TITLES.forEach(function (title, i) {
    const cls = i === step ? "step active" : i < step ? "step done" : "step";
    host.append(el("div", { class: cls },
      el("span", { class: "step-num", html: i < step ? ICON.check : String(i + 1) }),
      el("span", {}, title)));
    if (i < STEP_TITLES.length - 1) host.append(el("div", { class: "step-line" }));
  });
}

function jsonBlock(obj) {
  const text = JSON.stringify(obj, null, 2)
    .replace(/"([^"]+)":/g, '<span class="ev-key">"$1"</span>:')
    .replace(/: "([^"]*)"/g, ': <span class="ev-str">"$1"</span>')
    .replace(/: (\d+)/g, ': <span class="ev-num">$1</span>')
    .replace(/: (true|false)/g, ': <span class="ev-num">$1</span>')
    .replace(/: null/g, ': <span class="ev-null">null</span>');
  return el("pre", { class: "event", html: text });
}

const SAMPLE_EVENT = {
  class_uid: 2004, category_uid: 2, activity_id: 1,
  severity_id: 4, is_alert: true,
  time: 1762986541200, event_id: "3f9b2c1e-8a44-5d17-9e02-1c7a4b6f0d83",
  message: "检测到 SQL 注入攻击",
  src_endpoint: { ip: "10.20.3.44", port: 51824 },
  dst_endpoint: { ip: "10.20.9.7", port: 443 },
  device: { hostname: "FW-EDGE-01", type_id: 1 },
  finding_info: { uid: "AF-20261112-0031", title: "SQL 注入" },
  metadata: { product: { vendor_name: "深信服", name: "AF" }, version: "3.2.1" },
  unmapped: { rule_level: "高危", policy_id: "pol_8821" }
};

function renderWizardBody() {
  const body = $("#wizardBody");
  body.replaceChildren();
  $("#wizPrev").style.visibility = step === 0 ? "hidden" : "visible";

  if (step === 0) {
    $("#wizardSub").textContent = "先决定设备如何把数据送进来";
    const grid = el("div", { class: "option-grid" });
    Object.keys(CHANNELS).forEach(function (key) {
      const c = CHANNELS[key];
      grid.append(el("button", {
        class: "option", "aria-pressed": String(draft.channel === key),
        onclick: function () { draft.channel = key; renderWizardBody(); }
      },
        el("div", { class: "option-top" },
          el("span", { class: "option-icon", html: ICON[c.icon] }),
          el("span", { class: "option-title" }, c.label)),
        el("span", { class: "option-desc" }, c.desc)));
    });
    body.append(el("div", { class: "fieldset" }, grid));
    $("#wizNext").textContent = "下一步";
  }

  if (step === 1) {
    $("#wizardSub").textContent = "模板决定字段如何映射为 OCSF 事件";
    const list = el("div", { class: "template-list" });
    TEMPLATES.forEach(function (t) {
      list.append(el("button", {
        class: "template-row", "aria-pressed": String(draft.template === t.id),
        onclick: function () { draft.template = t.id; renderWizardBody(); }
      },
        el("div", {},
          el("div", { style: "font-weight:600;font-size:13px" }, t.name),
          el("div", { class: "cell-sub" }, t.vendor + " · " + t.id + (t.experimental ? " · 实验性" : ""))),
        el("span", { class: "badge badge-outline" }, t.kind),
        el("span", { class: "dim mono" }, "class " + t.class),
        el("span", { class: "tick", html: ICON.check })));
    });
    const warn = draft.template && tpl(draft.template).experimental
      ? el("div", { class: "callout callout-warn" }, el("span", { html: ICON.warn }),
          "该模板标记为实验性：厂商格式无公开规范，映射覆盖率可能偏低，失败样本会进入隔离区。")
      : null;
    body.append(el("div", { class: "fieldset" }, el("div", { class: "legend" }, "模板"), list, warn));
  }

  if (step === 2) {
    $("#wizardSub").textContent = "绑定接入方式并生成凭据";
    body.append(el("div", { class: "field" },
      el("label", { for: "cnName" }, "数据源名称"),
      el("input", { id: "cnName", value: draft.name, placeholder: "例如 边界防火墙",
        oninput: function (e) { draft.name = e.target.value; renderNextState(); } })));

    if (draft.channel === "http") {
      body.append(el("div", { class: "fieldset" },
        el("div", { class: "legend" }, "接入令牌"),
        codeBox("ing_live_9f2a4c8e71b3d650a4e2c19b7f8d3a6e"),
        el("div", { class: "callout" }, el("span", { html: ICON.info }),
          "令牌只在此处完整显示一次，之后只保留摘要。单个数据源限 50 次/秒、突发 200，单请求 10 MiB、单批 1000 条。")));
    }
    if (draft.channel === "syslog") {
      body.append(el("div", { class: "fieldset" },
        el("div", { class: "legend" }, "监听端口"),
        el("div", { class: "field" },
          el("label", { for: "cnPort" }, "UDP 与 TCP 同端口"),
          el("input", { id: "cnPort", value: draft.port,
            oninput: function (e) { draft.port = e.target.value; renderNextState(); } }),
          el("span", { class: "hint" }, "建议 1024 以上；绑定由服务端完成，报文内不读取任何身份字段。")),
        el("div", { class: "callout" }, el("span", { html: ICON.info }),
          "一个端口只对应一个数据源。端口变更通过热重载生效，不重启服务。")));
    }
    if (draft.channel === "kafka") {
      body.append(el("div", { class: "fieldset" },
        el("div", { class: "legend" }, "消费来源"),
        el("div", { class: "field" }, el("label", { for: "cnBrokers" }, "Brokers"),
          el("input", { id: "cnBrokers", value: draft.brokers,
            oninput: function (e) { draft.brokers = e.target.value; renderNextState(); } })),
        el("div", { class: "field" }, el("label", { for: "cnTopic" }, "Topic"),
          el("input", { id: "cnTopic", value: draft.topic,
            oninput: function (e) { draft.topic = e.target.value; renderNextState(); } })),
        el("div", { class: "callout" }, el("span", { html: ICON.info }),
          "使用独立消费组，位移只在事件成功发布后才提交；重启会重放未确认的部分。")));
    }
  }

  if (step === 3) {
    $("#wizardSub").textContent = "确认接入信息并做一次连通性自检";
    const t = tpl(draft.template);
    const target = draft.channel === "syslog" ? "10.41.84.81:" + draft.port
      : draft.channel === "kafka" ? draft.brokers + " · topic " + draft.topic
      : "POST /api/v1/ingestor/ingest/{id}";

    body.append(el("div", { class: "fieldset" },
      el("div", { class: "legend" }, "接入信息"),
      el("dl", { class: "kv" },
        el("dt", {}, "名称"), el("dd", { style: "font-weight:600" }, draft.name || "未命名数据源"),
        el("dt", {}, "通道"), el("dd", {}, CHANNELS[draft.channel].label),
        el("dt", {}, "模板"), el("dd", {}, t.name + " · " + t.vendor),
        el("dt", {}, "目标类"), el("dd", { class: "mono" }, "class_uid " + t.class),
        el("dt", {}, "接入地址"), el("dd", {}, codeBox(target)))));

    const result = el("div", { class: "fieldset" }, el("div", { class: "legend" }, "连通性自检"));
    const list = el("div", {});
    const steps = [
      draft.channel === "syslog" ? "绑定端口 " + draft.port : "校验接入配置",
      "发送样本并等待受理",
      "按模板解析为 OCSF 事件",
      "确认写入 spx.ingest.event"
    ];
    steps.forEach(function (label, i) {
      const done = checkState === "ok";
      list.append(el("div", { class: "check-step" + (done ? "" : " pending") },
        el("span", { class: "check-icon", html: done ? ICON.ok : '<span class="spinner"></span>' }),
        el("span", {}, label)));
    });
    result.append(list);

    if (checkState === "ok") {
      result.append(el("div", { class: "callout callout-ok" }, el("span", { html: ICON.ok }),
        "自检通过：样本已解析并写入事件主题，映射字段 9 / 未知字段 2。"));
      result.append(el("div", { class: "fieldset" },
        el("div", { class: "legend" }, "解析结果"), jsonBlock(SAMPLE_EVENT)));
    }
    body.append(result);
    $("#wizNext").textContent = "完成接入";
  }
  renderNextState();
}

function stepReady() {
  if (step === 0) return Boolean(draft.channel);
  if (step === 1) return Boolean(draft.template);
  if (step === 2) return Boolean(draft.name.trim());
  return true;
}
function renderNextState() { $("#wizNext").disabled = !stepReady(); }

$("#openWizard").addEventListener("click", function () {
  draft.channel = null; draft.template = null; draft.name = "";
  draft.port = "5514"; draft.topic = "soc.raw"; draft.brokers = "kafka.internal:9092";
  step = 0; checkState = "idle";
  renderSteps(); renderWizardBody(); show($("#wizard"));
});
$("#wizCancel").addEventListener("click", hide);
$("#wizPrev").addEventListener("click", function () {
  if (step > 0) { step--; renderSteps(); renderWizardBody(); }
});
$("#wizNext").addEventListener("click", function () {
  if (step < 3) { step++; renderSteps(); renderWizardBody(); return; }
  if (checkState !== "ok") {
    checkState = "running";
    renderWizardBody();
    setTimeout(function () { checkState = "ok"; renderWizardBody(); }, 1500);
    return;
  }
  const t = tpl(draft.template);
  const id = "cn_" + Math.random().toString(16).slice(2, 8);
  const binding = draft.channel === "syslog" ? "10.41.84.81:" + draft.port
    : draft.channel === "kafka" ? draft.brokers + " · topic " + draft.topic
    : "/api/v1/ingestor/ingest/" + id;
  CONNECTORS.unshift({ id: id, name: draft.name, channel: draft.channel, template: t.id,
    binding: binding, status: "active", hourly: 0, fill: 1, quarantine: 0 });
  renderRows(); hide();
});

/* ---------- 详情 ---------- */
let current = null;
function openDetail(c) {
  current = c;
  const t = tpl(c.template);
  $("#detailTitle").textContent = c.name;
  $("#detailSub").textContent = c.id + " · " + CHANNELS[c.channel].label + " · " + t.name;
  $("#detailPause").textContent = c.status === "active" ? "停用" : "启用";

  const body = $("#detailBody");
  body.replaceChildren();

  body.append(el("div", { class: "fieldset" },
    el("div", { class: "legend" }, "接入信息"),
    el("dl", { class: "kv" },
      el("dt", {}, "接入地址"), el("dd", {}, codeBox(c.binding)),
      el("dt", {}, "模板"), el("dd", {}, t.name + " · " + t.vendor),
      el("dt", {}, "目标类"), el("dd", { class: "mono" }, "class_uid " + t.class + " · " + t.kind),
      el("dt", {}, "状态"), el("dd", {}, c.status === "active" ? badge("ok", "启用") : badge("paused", "停用")))));

  body.append(el("div", { class: "fieldset" },
    el("div", { class: "legend" }, "解析质量"),
    el("div", { class: "quality" },
      el("div", { class: "stat" },
        el("div", { class: "stat-label" }, "映射填充率"),
        el("div", { class: "stat-value" }, (c.fill * 100).toFixed(1), el("small", {}, "%")),
        el("div", { class: "bar" }, el("i", { style: "width:" + (c.fill * 100) + "%" }))),
      el("div", { class: "stat" },
        el("div", { class: "stat-label" }, "近 1 小时事件"),
        el("div", { class: "stat-value" }, c.hourly.toLocaleString("zh-CN"))),
      el("div", { class: "stat" },
        el("div", { class: "stat-label" }, "隔离区占比"),
        el("div", { class: "stat-value" }, c.quarantine.toFixed(1), el("small", {}, "%")),
        el("div", { class: "bar" }, el("i", { style: "width:" + Math.min(c.quarantine * 8, 100) + "%;background:var(--chart-4)" }))))));

  body.append(el("div", { class: "fieldset" },
    el("div", { class: "legend" }, "最近样本"),
    jsonBlock({ time: 1762986541200, severity_id: 4, class_uid: t.class,
      src_endpoint: { ip: "10.20.3.44", port: 51824 },
      message: "检测到 SQL 注入攻击",
      metadata: { product: { vendor_name: t.vendor, name: t.name } },
      unmapped: { rule_level: "高危" } })));

  show($("#detail"));
}
$("#detailPause").addEventListener("click", function () {
  if (!current) return;
  current.status = current.status === "active" ? "paused" : "active";
  hide(); renderRows();
});
$("#detailDelete").addEventListener("click", function () {
  if (!current) return;
  CONNECTORS = CONNECTORS.filter(function (x) { return x.id !== current.id; });
  hide(); renderRows();
});
$("#detailRecheck").addEventListener("click", function () {
  $("#detailSub").textContent = "正在自检…";
  setTimeout(function () { if (current) $("#detailSub").textContent = current.id + " · 自检通过"; }, 1200);
});

</script>
</body>
</html>
