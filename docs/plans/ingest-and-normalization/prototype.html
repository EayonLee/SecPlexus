<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>数据源接入 · 原型 · SecPlexus</title>
<style>
  :root{
    --radius:.75rem;
    --background:#ffffff;--foreground:#0a1317;
    --card:#ffffff;--card-foreground:#0a1317;
    --primary:#0064e0;--primary-foreground:#ffffff;
    --secondary:#f1f4f7;--secondary-foreground:#1c1e21;
    --muted:#f1f4f7;--muted-foreground:#5d6c7b;
    --destructive:#e41e3f;
    --border:#dee3e9;--input:#ced0d4;--ring:#1876f2;
    --positive:#31a24c;--negative:#e41e3f;--attention:#f2a918;
    --chart-1:#0064e0;--chart-4:#8a8a8a;--chart-5:#6b6b6b;
    --sidebar:#ffffff;--sidebar-foreground:#0a1317;
    --sidebar-accent:#f1f4f7;--sidebar-border:#dee3e9;
    --sidebar-w:232px;--pad:24px;--gap:16px;
    --radius-card:8px;--radius-control:6px;
    --control-h:32px;--row-h:48px;--nav-row:32px;
    --fs-title:24px;--fs-section:16px;--fs-kpi:24px;--fs-body:14px;--fs-small:12px;
    --t-hover:150ms;--t-press:120ms;--ease:cubic-bezier(0.22,1,0.36,1);
  }
  html.dark{
    --background:#0a0a0a;--foreground:#fafafa;
    --card:#111111;--card-foreground:#fafafa;
    --primary:#0091ff;--primary-foreground:#0a1317;
    --secondary:#262626;--secondary-foreground:#f5f5f5;
    --muted:#262626;--muted-foreground:#a3a3a3;
    --destructive:#f0284a;
    --border:#262626;--input:#333333;--ring:#66b8ff;
    --positive:#3fc07a;--negative:#e5566f;--attention:#e5a93b;
    --chart-1:#0091ff;--chart-4:#a3a3a3;--chart-5:#d4d4d4;
    --sidebar:#0a0a0a;--sidebar-foreground:#fafafa;
    --sidebar-accent:#262626;--sidebar-border:#1a1a1a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:Montserrat,"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    background:var(--background);color:var(--foreground);font-size:var(--fs-body);line-height:1.5;
    -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  button{font:inherit;color:inherit}
  .shell{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);min-height:100svh}
  .sidebar{position:sticky;top:0;height:100svh;background:var(--sidebar);display:flex;flex-direction:column;
    transition:width .2s var(--ease);overflow:hidden}
  .sidebar.collapsed{width:3rem}
  .sidebar-head{display:flex;align-items:center;padding:.375rem .75rem .375rem .625rem;flex:none;height:48px}
  .brand-btn{display:flex;align-items:center;gap:.5rem;height:2rem;width:100%;padding:0 .5rem;
    border-radius:6px;font-size:1rem;font-weight:600;border:0;background:none;cursor:pointer;text-align:left;
    color:var(--sidebar-foreground);transition:background var(--t-hover) ease}
  .brand-btn:hover{background:var(--sidebar-accent)}
  .brand-btn svg{width:1rem;height:1rem;flex:none;color:var(--primary)}
  .sidebar-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:.25rem .5rem}
  .nav-group{margin-bottom:.25rem}
  .nav-label{display:flex;align-items:center;height:2rem;padding:0 .5rem;font-size:12px;font-weight:400;
    color:color-mix(in srgb,var(--sidebar-foreground) 70%,transparent);white-space:nowrap;transition:opacity .2s}
  .sidebar.collapsed .nav-label{opacity:0;pointer-events:none}
  .nav-item{display:flex;align-items:center;gap:.5rem;height:var(--nav-row);padding:0 .5rem;border-radius:6px;
    font-size:14px;font-weight:400;color:var(--sidebar-foreground);cursor:pointer;border:0;background:none;
    width:100%;text-align:left;white-space:nowrap;transition:background var(--t-hover) ease}
  .nav-item:hover{background:var(--sidebar-accent);color:var(--sidebar-accent-foreground)}
  .nav-item[aria-current=page]{background:var(--sidebar-accent);color:var(--sidebar-accent-foreground)}
  .nav-item svg{width:16px;height:16px;flex:none;stroke-width:1.5}
  .nav-item span{overflow:hidden;text-overflow:ellipsis}
  .sidebar.collapsed .nav-item span{opacity:0}
  .sidebar.collapsed .nav-item{padding:0;display:grid;place-items:center}
  .main{min-width:0;display:flex;flex-direction:column}
  .topbar{display:flex;height:48px;align-items:center;gap:.5rem;border-bottom:1px solid var(--border);padding:0 1rem;flex:none}
  .v-sep{width:1px;height:1rem;background:var(--border);margin:0 .5rem;flex:none}
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:.25rem}
  .ghost-icon{display:grid;place-items:center;width:28px;height:28px;border-radius:6px;border:0;
    background:transparent;color:var(--muted-foreground);cursor:pointer;transition:background var(--t-hover) ease}
  .ghost-icon:hover{background:var(--secondary);color:var(--foreground)}
  .ghost-icon svg{width:16px;height:16px}
  .avatar-btn{display:grid;place-items:center;width:2rem;height:2rem;border-radius:6px;border:0;
    background:var(--secondary);color:var(--foreground);cursor:pointer;font-size:12px;font-weight:500}
  .avatar-menu{position:absolute;top:calc(100% + 6px);right:0;min-width:11rem;background:var(--card);
    border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 16px rgb(0 0 0/.08);padding:.25rem;z-index:50;display:none}
  .avatar-menu.open{display:block}
  .avatar-menu button{display:flex;align-items:center;gap:.5rem;width:100%;padding:.375rem .5rem;
    border-radius:.375rem;border:0;background:none;font-size:13px;cursor:pointer;text-align:left;color:var(--foreground)}
  .avatar-menu button:hover{background:var(--secondary)}
  .avatar-menu svg{width:1rem;height:1rem}
  .content{padding:var(--pad)}
  h1{font-size:var(--fs-title);font-weight:600;margin:0;letter-spacing:-.01em;line-height:1.2}
  .sub{margin-top:4px;color:var(--muted-foreground);font-size:var(--fs-body)}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);margin-top:20px;
    border:1px solid var(--border);border-radius:var(--radius-card);background:var(--card);overflow:hidden}
  .kpi{padding:16px 20px;display:flex;flex-direction:column;gap:4px;min-width:0}
  .kpi + .kpi{border-left:1px solid var(--border)}
  .kpi-label{font-size:var(--fs-small);color:var(--muted-foreground);font-weight:400}
  .kpi-value{font-size:var(--fs-kpi);font-weight:500;letter-spacing:-.01em;line-height:1.3}
  .kpi-value small{font-size:14px;font-weight:400;color:var(--muted-foreground);margin-left:2px}
  .kpi-foot{font-size:var(--fs-small);color:var(--muted-foreground)}
  .kpi-foot .pos{color:var(--positive)}
  .kpi-foot .neg{color:var(--negative)}
  @media (max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}
    .kpi:nth-child(n+3){border-top:1px solid var(--border)}
    .kpi:nth-child(2n+1){border-left:0}}
  .toolbar{display:flex;align-items:center;gap:8px;margin:20px 0 16px;flex-wrap:wrap}
  .toolbar .spacer{flex:1}
  .input-group{display:flex;align-items:center;gap:7px;height:var(--control-h);padding:0 10px;
    border:1px solid var(--input);border-radius:var(--radius-control);background:var(--card);width:256px}
  .input-group:focus-within{outline:2px solid var(--ring);outline-offset:1px}
  .input-group input{border:0;outline:0;background:transparent;width:100%;font-size:13px;color:var(--foreground)}
  .input-group input::placeholder{color:var(--muted-foreground)}
  .input-group svg{width:15px;height:15px;color:var(--muted-foreground);flex:none}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:var(--control-h);
    padding:0 12px;border-radius:var(--radius-control);border:1px solid var(--input);background:var(--card);
    font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;transition:background var(--t-hover) ease,transform var(--t-press) var(--ease)}
  .btn:hover{background:var(--secondary)}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.5;cursor:not-allowed;pointer-events:none}
  .btn.primary{background:var(--primary);color:var(--primary-foreground);border-color:transparent}
  .btn.danger{color:var(--destructive)}
  .btn-sm{height:28px;padding:0 10px;font-size:12px}
  .table-card{border:1px solid var(--border);border-radius:var(--radius-card);overflow:hidden;background:var(--card)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:left;font-weight:400;color:var(--muted-foreground);padding:10px 14px;
    border-bottom:1px solid var(--border);font-size:var(--fs-small);white-space:nowrap}
  tbody td{padding:12px 14px;border-bottom:1px solid color-mix(in srgb,var(--border) 50%,transparent);vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:color-mix(in srgb,var(--secondary) 50%,transparent)}
  .cell-name{font-weight:500}
  .cell-sub{color:var(--muted-foreground);font-size:12px;margin-top:2px}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;font-variant-numeric:tabular-nums}
  .dim{color:var(--muted-foreground)}
  .badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;
    font-size:12px;font-weight:500;white-space:nowrap}
  .badge-dot{width:6px;height:6px;border-radius:999px;background:currentColor;flex:none}
  .badge-ok{background:color-mix(in srgb,var(--positive) 10%,var(--card));color:color-mix(in srgb,var(--positive) 80%,var(--foreground))}
  .badge-warn{background:color-mix(in srgb,var(--attention) 12%,var(--card));color:color-mix(in srgb,var(--attention) 80%,var(--foreground))}
  .badge-err{background:color-mix(in srgb,var(--destructive) 10%,var(--card));color:var(--destructive)}
  .badge-idle{background:var(--secondary);color:var(--muted-foreground)}
  .badge-outline{background:transparent;border:1px solid var(--border);color:var(--muted-foreground)}
  .pager{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:16px}
  .pager .info{font-size:13px;color:var(--muted-foreground)}
  .pager .controls{display:flex;align-items:center;gap:8px}
  .callout{display:flex;gap:9px;padding:10px 12px;border-radius:8px;background:var(--secondary);
    font-size:13px;line-height:1.5;align-items:flex-start}
  .callout svg{width:15px;height:15px;flex:none;margin-top:1px;color:var(--muted-foreground)}
  .callout-warn{background:color-mix(in srgb,var(--attention) 10%,var(--card))}
  .callout-warn svg{color:var(--attention)}
  .callout-ok{background:color-mix(in srgb,var(--positive) 8%,var(--card))}
  .callout-ok svg{color:var(--positive)}
  .callout-err{background:color-mix(in srgb,var(--destructive) 8%,var(--card))}
  .callout-err svg{color:var(--destructive)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:6px;
    border:1px solid var(--input);font-size:12px;background:var(--card);cursor:pointer}
  .chip[aria-pressed=true]{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 8%,var(--card));font-weight:500}
  .fieldset{display:flex;flex-direction:column;gap:8px}
  .legend{font-size:12px;font-weight:500;color:var(--muted-foreground);display:flex;align-items:center;gap:8px}
  .legend .hint-inline{font-weight:400;font-size:12px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:13px;font-weight:500}
  .field input,.field select,.field textarea{height:32px;border-radius:6px;border:1px solid var(--input);
    background:var(--card);color:var(--foreground);padding:0 10px;font:inherit;font-size:13px}
  .field textarea{height:auto;min-height:80px;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.5;resize:vertical}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--ring);outline-offset:1px}
  .field .hint{font-size:12px;color:var(--muted-foreground)}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .scrim{position:fixed;inset:0;background:rgb(0 0 0/.38);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
  .scrim.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;top:0;right:0;height:100svh;width:min(720px,96vw);background:var(--card);
    border-left:1px solid var(--border);display:flex;flex-direction:column;transform:translateX(101%);
    transition:transform .2s var(--ease);z-index:41}
  .sheet.open{transform:none}
  .sheet-editor{left:15vw;width:70vw;transform:translateY(-102%)}
  .sheet-editor.open{transform:none}
  .editor-cols{display:grid;grid-template-columns:1fr 1fr;flex:1;min-height:0}
  .editor-col{overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
  .editor-col.left{border-right:1px solid var(--border)}
  .sample-row{display:flex;gap:6px;align-items:center}
  .sample-row textarea{flex:1;min-height:40px;height:40px;padding:7px 10px;border-radius:6px;border:1px solid var(--input);
    background:var(--card);color:var(--foreground);font-family:ui-monospace,Menlo,monospace;font-size:12px;resize:none;line-height:1.4}
  .sample-row textarea.good{border-color:var(--positive)}
  .sample-row textarea.bad{border-color:var(--destructive)}
  .sample-del{width:28px;height:28px;border-radius:6px;border:0;background:transparent;color:var(--muted-foreground);
    cursor:pointer;flex:none;display:grid;place-items:center}
  .sample-del:hover{background:var(--secondary);color:var(--destructive)}
  .sample-status{font-size:11px;min-height:14px}
  .sample-status.ok{color:var(--positive)}
  .sample-status.bad{color:var(--destructive)}
  .field-chips{display:flex;flex-wrap:wrap;gap:6px}
  .field-chip{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:6px;
    background:var(--secondary);font-size:12px;cursor:pointer;border:1px solid transparent}
  .field-chip:hover{border-color:var(--primary);color:var(--primary)}
  .field-chip.mapped{opacity:.4}
  .map-row{display:grid;grid-template-columns:1fr 18px 1.5fr 28px;gap:8px;align-items:center}
  .map-arrow{color:var(--muted-foreground);text-align:center}
  .map-row select,.map-row input{height:30px;border-radius:6px;border:1px solid var(--input);background:var(--card);
    color:var(--foreground);padding:0 8px;font-size:12px;min-width:0}
  .map-del{width:26px;height:26px;border-radius:6px;border:0;background:transparent;color:var(--muted-foreground);cursor:pointer}
  .map-del:hover{color:var(--destructive);background:var(--secondary)}
  .panel{border:1px solid var(--border);border-radius:var(--radius-card);margin:0;background:var(--card)}
  .panel-row{display:grid;grid-template-columns:140px 1fr;gap:12px;padding:8px 12px;
    border-bottom:1px solid color-mix(in srgb,var(--border) 50%,transparent);font-size:13px}
  .panel-row:last-child{border-bottom:0}
  .panel-row dt{color:var(--muted-foreground);margin:0}
  .panel-row dd{margin:0;min-width:0}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  pre.event{margin:0;padding:12px;border-radius:8px;background:var(--secondary);font-family:ui-monospace,Menlo,monospace;
    font-size:12px;line-height:1.5;overflow:auto;max-height:280px;color:var(--foreground)}
  .ev-key{color:var(--chart-1)}.ev-num{color:var(--chart-5)}.ev-str{color:var(--positive)}.ev-null{color:var(--muted-foreground)}
  .empty{padding:32px 20px;text-align:center;color:var(--muted-foreground);font-size:13px}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);padding:0 20px;overflow-x:auto}
  .tab{border:0;background:transparent;padding:8px 11px;font-size:13px;color:var(--muted-foreground);
    cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:400;white-space:nowrap}
  .tab:hover{color:var(--foreground)}
  .tab[aria-selected=true]{color:var(--foreground);border-bottom-color:var(--primary);font-weight:500}
  .stream{display:flex;flex-direction:column;font-size:12px}
  .stream-row{display:grid;grid-template-columns:58px 1fr auto;gap:10px;padding:8px 11px;
    border-bottom:1px solid color-mix(in srgb,var(--border) 50%,transparent);align-items:center}
  .stream-row:last-child{border-bottom:0}
  .stream-row.bad{background:color-mix(in srgb,var(--destructive) 5%,var(--card))}
  .stream-time{color:var(--muted-foreground);font-family:ui-monospace,Menlo,monospace;font-size:12px}
  .stream-msg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:999px;
    font-size:11px;font-weight:500;white-space:nowrap}
  .pill-ok{background:color-mix(in srgb,var(--positive) 10%,var(--card));color:color-mix(in srgb,var(--positive) 80%,var(--foreground))}
  .pill-bad{background:color-mix(in srgb,var(--destructive) 10%,var(--card));color:var(--destructive)}
  .quality{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--border);border-radius:var(--radius-card);
    overflow:hidden;background:var(--card)}
  .quality .stat{padding:16px 20px;display:flex;flex-direction:column;gap:4px}
  .quality .stat + .stat{border-left:1px solid var(--border)}
  .stat-label{font-size:var(--fs-small);color:var(--muted-foreground)}
  .stat-value{font-size:var(--fs-kpi);font-weight:500;line-height:1.3}
  .stat-value small{font-size:14px;font-weight:400;color:var(--muted-foreground)}
  .code-box{display:flex;align-items:center;gap:8px;background:var(--secondary);border-radius:6px;
    padding:7px 10px;font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}
  .code-box .grow{flex:1;min-width:0}
  .copy{border:0;background:transparent;color:var(--muted-foreground);cursor:pointer;flex:none;display:grid;place-items:center}
  .copy:hover{color:var(--foreground)}
  .divider{height:1px;background:var(--border);margin:2px 0}
  @media (max-width:1200px){.sheet-editor{left:2vw;width:96vw}.editor-cols{grid-template-columns:1fr}
    .editor-col.left{border-right:0;border-bottom:1px solid var(--border)}}
  @media (max-width:900px){
    .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:30;width:232px;transform:translateX(-100%);
      transition:transform .2s ease;box-shadow:0 0 24px rgb(0 0 0/.12)}
    .sidebar.open{transform:none}
    .kpis{grid-template-columns:repeat(2,1fr)}
    .kpi:nth-child(n+3){border-top:1px solid var(--border)}
    .kpi:nth-child(2n+1){border-left:0}
    .kpi:nth-child(2n){border-left:1px solid var(--border)}
    .option-grid,.grid-3,.two-col{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<div class="shell">
  <!-- 侧栏结构对齐 src/apps/web/src/spx/components/shell.tsx：
       主导航（非设置页）只有「工作台」分组；数据源是业务功能，进主导航的「数据」分组。 -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <button class="brand-btn" type="button" title="SecPlexus">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3"/></svg>
        <span>SecPlexus</span>
      </button>
    </div>
    <div class="sidebar-body" role="navigation" aria-label="主导航">
      <div class="nav-group">
        <div class="nav-label">工作台</div>
        <button class="nav-item" type="button" data-view="workbench">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
          <span>安全智驾工作台</span>
        </button>
      </div>
      <div class="nav-group">
        <div class="nav-label">数据源</div>
        <button class="nav-item" type="button" data-view="connectors" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg>
          <span>数据源</span>
        </button>
        <button class="nav-item" type="button" data-view="templates">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M4 9h16M9 9v11"/></svg>
          <span>解析规则</span>
        </button>

      </div>
    </div>
  </aside>

  <div class="main">

    if (k === "class") n.className = v;

/* ==========================================================================
   映射引擎（原型内的最小实现；用来证明"先验证后启用"可行）
   ========================================================================== */
function getPath(obj, path) {
  const parts = String(path).split(".");
  let cur = obj;
  for (let i = 0; i < parts.length; i++) {
    if (cur === null || cur === undefined) return undefined;
    cur = cur[parts[i]];
  }
  return cur;
}
function setPath(obj, path, value) {
  const parts = String(path).split(".");
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    if (!cur[parts[i]] || typeof cur[parts[i]] !== "object") cur[parts[i]] = {};
    cur = cur[parts[i]];
  }
  cur[parts[parts.length - 1]] = value;
}
function detectFormat(text) {
  const t = text.trim();
  if (t.charAt(0) === "{" || t.charAt(0) === "[") {
    try { JSON.parse(t); return { format:"JSON", note:"首字符 { 且可解析" }; }
    catch (e) { return { format:"未知", note:"看起来像 JSON 但无法解析" }; }
  }
  if (t.indexOf("CEF:") === 0) return { format:"CEF", note:"前缀 CEF:" };
  
  if (/^[A-Za-z0-9_.-]+=/.test(t)) return { format:"KV", note:"键值对，多分隔符" };
  return { format:"纯文本", note:"无结构，整体作为 message" };
}
function detectEncoding(text) {
  // 浏览器里已被解码成字符串；这里演示"探测结论"的呈现位置。
  const hasReplacement = text.indexOf("\uFFFD") >= 0;
  if (hasReplacement) return { encoding:"GB18030 → UTF-8（有损）", lossy:true };
  return { encoding:"UTF-8（严格）", lossy:false };
}
function parseTime(raw, t) {
  const v = raw[t.timeField];
  if (v === undefined || v === null || v === "") return { value:null, ok:false, note:"字段缺失，置 null 并记 warning" };
  if (t.timeFormat === "unix_ms") {
    const n = Number(v);
    if (!isFinite(n) || n <= 0) return { value:null, ok:false, note:"非法毫秒时间戳" };
    return { value:new Date(n).toISOString(), ok:true, note:"unix_ms → ISO" };
  }
  const d = new Date(v);
  if (isNaN(d.getTime())) return { value:null, ok:false, note:"非法 RFC3339" };
  return { value:d.toISOString(), ok:true, note:"RFC3339 → ISO" };
}
function parseSeverity(raw, t) {
  if (!t.severityField) return { value:0, ok:true, note:"解析规则未声明 severity 字段，0 (Unknown)" };
  const v = raw[t.severityField];
  if (v === undefined || v === null) return { value:0, ok:false, note:"源字段缺失，0 (Unknown)" };
  const key = String(v).trim();
  for (const k in t.severityMap) {
    if (k.toLowerCase() === key.toLowerCase()) return { value:t.severityMap[k], ok:true, note:"「" + key + "」→ " + t.severityMap[k] };
  }
  const n = Number(key);
  if (!isNaN(n) && n >= 0 && n <= 6) return { value:n, ok:true, note:"已是 OCSF 档位" };
  return { value:0, ok:false, note:"未识别档位「" + key + "」，0 + warning" };
}
function mapSample(t, rawText) {
  const fmt = detectFormat(rawText);
  const enc = detectEncoding(rawText);
  if (fmt.format !== "JSON") {
    return { error:"该解析规则要求 JSON；探测到 " + fmt.format + "（" + fmt.note + "）。可换解析规则，或走通用接入：事件原文保留、parse_status=error（原因码 format_mismatch）。", fmt:fmt, enc:enc };
  }
  let raw;
  try { raw = JSON.parse(rawText); } catch (e) { return { error:"样本不是合法 JSON", fmt:fmt, enc:enc }; }
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) return { error:"样本必须是 JSON 对象", fmt:fmt, enc:enc };

  const rows = [];
  const consumed = {};
  const event = {
    class_uid: t.classUid, category_uid: Math.floor(t.classUid / 1000),
    activity_id: 1, severity_id: 0, is_alert: t.kind === "detection", time: null, message: null,
    unmapped: {}
  };

  event.metadata = { product: { vendor_name: t.vendor, name: t.name }, version: t.version, parse_status: "ok", parse_errors: [] };
  const tm = parseTime(raw, t);
  event.time = tm.value;
  if (!tm.ok) { event.metadata.parse_status = "error"; event.metadata.parse_errors.push({ field: t.timeField, code: "time_invalid" }); } consumed[t.timeField] = true;
  rows.push({ src:t.timeField, dst:"time", ok:tm.ok, note:tm.note });

  const sv = parseSeverity(raw, t);
  event.severity_id = sv.value;
  if (!sv.ok) { event.metadata.parse_status = "error"; event.metadata.parse_errors.push({ field: t.severityField, code: "severity_unmapped" }); }
  if (t.severityField) consumed[t.severityField] = true;
  rows.push({ src:t.severityField || "（未声明）", dst:"severity_id", ok:sv.ok, note:sv.note });

  for (const src in t.fieldMap) {
    const dst = t.fieldMap[src];
    const value = getPath(raw, src);
    consumed[src.split(".")[0]] = true;
    if (value === undefined || value === null) {
      setPath(event, dst, null);
      event.metadata.parse_status = "error";
      event.metadata.parse_errors.push({ field: src, code: "source_missing" });
      rows.push({ src:src, dst:dst, ok:false, note:"源字段缺失，置 null · parse_status=error" });
      continue;
    }
    const wantInt = /\.port$/.test(dst);
    setPath(event, dst, wantInt && isFinite(Number(value)) ? Number(value) : value);
    rows.push({ src:src, dst:dst, ok:true, note:wantInt ? "转 int" : "直映射" });
  }

  for (const c in t.constants) setPath(event, c, t.constants[c]);
  if (t.disposition && raw[t.disposition.field] !== undefined) {
    const mapped = t.disposition.map[String(raw[t.disposition.field])];
    event.disposition = mapped || null;
    consumed[t.disposition.field] = true;
    rows.push({ src:t.disposition.field, dst:"disposition",
      ok:Boolean(mapped), note:mapped ? "security_control：" + mapped : "未在映射表中，置 null" });
  }

  for (const k in raw) if (!consumed[k]) event.unmapped[k] = raw[k];

  const mapped = rows.filter(function (r) { return r.ok; }).length;
  const unmappedKeys = Object.keys(event.unmapped);
  return { event:event, rows:rows, mapped:mapped, total:rows.length, unmappedKeys:unmappedKeys,
           fmt:fmt, enc:enc, keyField:unmappedKeys.length ? "src_endpoint.ip" : "src_endpoint.ip",
           fill: rows.length ? mapped / rows.length : 0 };
}
function inheritanceChain(t) {
  const chain = [t];
  let cur = t;
  while (cur.extendsId) { cur = tpl(cur.extendsId); chain.unshift(cur); }
  return chain;
}

/* ---------- 页面指标：从接入点实时汇总 ----------
   架构语义：没有独立的隔离区。所有事件进同一个 spx.ingest.event，
   事件带 metadata.parse_status = ok | error（+ 原因码）；
   解析异常的事件保留已解析字段与原文，照样可查，业务按 parse_status 过滤。 */
function computePageMetrics() {
  const total = CONNECTORS.length;
  const running = CONNECTORS.filter(function (c) { return c.state === "running"; }).length;
  const hourly = CONNECTORS.reduce(function (acc, c) { return acc + c.hourly; }, 0);
  const ratePerSec = hourly / 3600;
  // 解析失败率：按事件量加权（parse_status=error 占比）
  const failedEvents = CONNECTORS.reduce(function (acc, c) { return acc + c.hourly * c.parseFail / 100; }, 0);
  const parseFailRate = hourly > 0 ? failedEvents / hourly * 100 : 0;
  /* 24h 环比（Splunk notable changes：±50% 需要关注——数据量骤降是断流最强信号） */
  const volumeChange = -18.4;
  return {
    total: total, running: running,
    ratePerSec: ratePerSec,
    parseFailRate: parseFailRate,
    volumeChange: volumeChange,
    series: [4.2, 4.8, 4.5, 5.1, 5.6, 5.4, 5.0, 4.8, 5.2, 5.5, 5.8, 5.3, 5.0, 5.1, 5.4, 5.2].map(function (v) { return v * (ratePerSec / 5 || 1); }),
  };
}

/* 搜索匹配列表字段：数据源名称（name/id）与解析规则名称（厂商/规则名） */
function refreshTable() {
  const body = $("#rows");
  if (!body) return;
  const q = query.trim().toLowerCase();
  const rows = CONNECTORS.filter(function (c) {
    const t = tpl(c.template);
    const hay = (c.name + " " + c.id + " " + t.name + " " + t.vendor).toLowerCase();
    return (channelFilter === "all" || c.channel === channelFilter)
        && (stateFilter === "all" || c.state === stateFilter)
        && (!q || hay.indexOf(q) >= 0);
  });
  const pages = Math.max(1, Math.ceil(rows.length / pageSize));
  if (page >= pages) page = pages - 1;
  const slice = rows.slice(page * pageSize, page * pageSize + pageSize);
  body.replaceChildren();
  if (!slice.length) {
    body.append(el("tr", {}, el("td", { colspan:"6" }, el("div", { class:"empty" }, "没有匹配的数据源"))));
  }
  slice.forEach(function (c) {
    const t = tpl(c.template);
    const canStart = c.state !== "running";
    body.append(el("tr", {},
      el("td", { onclick:function(){ openDetail(c); }, style:"cursor:pointer" },
        el("div", { class:"cell-name" }, c.name),
        el("div", { class:"mono cell-sub" }, c.id)),
      el("td", { onclick:function(){ openDetail(c); }, style:"cursor:pointer" },
        el("span", { class:"badge badge-outline" }, CHANNELS[c.channel].label)),
      el("td", { onclick:function(){ openDetail(c); }, style:"cursor:pointer" },
        el("div", {}, t.name),
        el("div", { class:"cell-sub" }, t.vendor)),
      el("td", { onclick:function(){ openDetail(c); }, style:"cursor:pointer" },
        el("span", { class:"mono dim" }, c.binding)),
      el("td", { onclick:function(){ openDetail(c); }, style:"cursor:pointer" },
        stateBadge(c.state),
        c.state === "running"
          ? el("div", { class:"cell-sub" }, "最近 " + c.lastSeen)
          : null),
      el("td", {},
        canStart
          ? el("button", { class:"btn btn-outline btn-sm", onclick:function(){ c.state = "running"; c.lastSeen = "刚刚"; refreshTable(); refreshBanner(); } }, "启动")
          : el("button", { class:"btn btn-outline btn-sm", onclick:function(){ c.state = "stopped"; refreshTable(); refreshBanner(); } }, "停止"),
        el("button", { class:"btn btn-outline btn-sm", style:"margin-left:4px", onclick:function(){ openConnectorEditor(c); } }, "编辑"),
        el("button", { class:"btn btn-danger btn-sm", style:"margin-left:4px", onclick:function(){ deleteConnector(c); } }, "删除"))));
  });

  const pager = $("#pager");
  if (!pager) return;
  pager.replaceChildren();
  pager.append(el("div", { style:"display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:16px" },
    el("span", { class:"dim", style:"font-size:.875rem" },
      "共 " + rows.length + " 条 · 第 " + (page + 1) + "/" + pages + " 页"),
    el("div", { style:"display:flex;align-items:center;gap:8px" },
      el("button", { class:"btn btn-outline btn-sm", onclick:function () {
        const order = [10, 20, 30, 40, 50];
        pageSize = order[(order.indexOf(pageSize) + 1) % order.length];
        page = 0; refreshTable();
      } }, "每页 " + pageSize + " 行"),
      el("button", { class:"btn btn-outline btn-sm", disabled: page === 0,
        onclick:function(){ page--; refreshTable(); } }, "上一页"),
      el("button", { class:"btn btn-outline btn-sm", disabled: page >= pages - 1,
        onclick:function(){ page++; refreshTable(); } }, "下一页"))));
}

function showSheet(sheet) {
  $("#scrim").classList.add("open");
  sheet.classList.add("open");
  sheet.setAttribute("aria-hidden", "false");
  openSheetRef = sheet;
}
function hideSheets() {
  $("#scrim").classList.remove("open");
  ["#wizard", "#detail", "#tplSheet"].forEach(function (s) {
    const n = $(s);
    if (!n) return;
    n.classList.remove("open");
    n.setAttribute("aria-hidden", "true");
  });
  openSheetRef = null;
}
$("#scrim").addEventListener("click", hideSheets);
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && openSheetRef) hideSheets(); });
$$("[data-close]").forEach(function (b) { b.addEventListener("click", hideSheets); });

function renderSteps() {
  const host = $("#steps");
  host.replaceChildren();
  STEP_TITLES.forEach(function (title, i) {
    host.append(el("div", { class:"step" + (i === step ? " active" : i < step ? " done" : "") },
      el("span", { class:"step-num", html:i < step ? ICON.check : String(i + 1) }),
      el("span", {}, title)));
    if (i < STEP_TITLES.length - 1) host.append(el("div", { class:"step-line" }));
  });
}

function chipsOf(list, selected, onToggle) {
  const box = el("div", { class:"chips" });
  list.forEach(function (v) {
    box.append(el("button", { type:"button", class:"chip",
      "aria-pressed":String(selected.indexOf(v) >= 0),
      onclick:function(){ onToggle(v); } }, v));
  });
  return box;
}

  if (step === 3) {

    body.append(el("div", { class:"field", style:"max-width:340px" },
      el("label", { for:"cnName" }, "数据源名称"),

      body.append(el("div", { class:"fieldset" },

          }),
          el("span", { class:"hint" }, "其余类型返回 415")),
        el("div", { class:"callout" }, el("span", { html:ICON.info }),

        el("div", { class:"callout" }, el("span", { html:ICON.info }),
          "成功返回 202 与受理计数；解析与发布在响应之后异步完成，解析失败不改写事件流（parse_status=error），不回传设备。")));
    }

    if (draft.channel === "syslog") {

        .map(function (c) { return c.cfg.port; });
      const conflict = taken.indexOf(draft.port) >= 0;
      body.append(el("div", { class:"fieldset" },

          el("div", { class:"panel-row" }, el("dt", {}, "故障重放"), el("dd", {}, "未提交的位移在重启后重放，可能重复；下游用 event_id 去重")))));
    }
  }

    if (draft.channel) {
      /* 接入指引：把设备侧需要的配置直接生成出来（Wazuh 向导的 command-output 模式：

      const guideMap = {

        ],

        ],

        el("div", { class:"legend" }, "接入指引",

  if (step === 1) {

        : el("div", { class:"callout callout-ok" },

      const keyValue = r.event.src_endpoint && r.event.src_endpoint.ip
        ? "src_endpoint.ip = " + r.event.src_endpoint.ip

      const eventMeta = el("dl", { class:"panel" },
        el("div", { class:"panel-row" }, el("dt", {}, "分区键"),
          el("dd", { class:"mono" }, keyValue)),
        el("div", { class:"panel-row" }, el("dt", {}, "event_id"),
          el("dd", { class:"mono" }, "UUIDv5(connector + 指纹)")));

      const eventCol = el("div", { class:"fieldset" },
        el("span", { class:"hint" }, "解析出的 OCSF 事件"),
        jsonBlock(r.event),
        eventMeta);
      const mapCol = el("div", { class:"fieldset" },
        el("span", { class:"hint" }, "字段映射"),
        mapTable);

      body.append(el("div", { class:"fieldset" },
        el("div", { class:"legend" }, "验证结果 · 映射 " + r.mapped + "/" + r.total),
        el("div", { class:"two-col" }, eventCol, mapCol),
        unmappedNote));
    }
  }

function defaultSample(t) {
  const s = {};
  s[t.timeField] = t.timeFormat === "unix_ms" ? 1762986541200 : "2026-11-12T20:31:04Z";
  if (t.severityField) {
    const keys = Object.keys(t.severityMap);
    s[t.severityField] = keys.length ? keys[0] : "high";
  }
  const srcs = Object.keys(t.fieldMap).slice(0, 5);
  srcs.forEach(function (k, i) {
    if (k === t.timeField || k === t.severityField) return;
    const dst = t.fieldMap[k];
    s[k] = /\.port$/.test(dst) ? 443 + i : (i === 0 ? "10.20.3.44" : "值-" + (i + 1));
  });
  s["extra_field"] = "该厂商独有，解析规则未映射";
  return JSON.stringify(s, null, 2);
}

function stepReady() {
  if (step === 0) return Boolean(draft.template);
  /* 验证通过，或显式选择通用回退（原文透传），两者其一即可前进。 */
  if (step === 1) return Boolean(draft.genericFallback || (verifyResult && !verifyResult.error));
  if (step === 2) return Boolean(draft.channel);
  if (step === 3) {
    if (!draft.name.trim()) return false;
    if (draft.channel === "syslog") {
      return !CONNECTORS.some(function (c) { return c.channel === "syslog" && c.cfg.port === draft.port; });
    }
    return true;
  }
  return true;
}

/* 解析规则删除：物理删除。前置条件——没有任何数据接入引用它；
   有关联时阻止并列出关联的数据源，须先停止并删除它们（数据流一致性：
   规则被移除后正在消费的接入点会立即失去映射）。内置解析规则只读（随二进制分发）。 */
function deleteRule(t) {
  if (!t.custom) {
    alert("内置解析规则随二进制分发，不可删除。要改它，请创建自定义副本。");
    return;
  }
  const refs = CONNECTORS.filter(function (c) { return c.template === t.id; });
  if (refs.length) {
    alert("无法删除：有 " + refs.length + " 个数据接入正在使用此规则。\n" +
      refs.map(function (c) { return "· " + c.name + "（" + (c.state === "running" ? "运行中，需先停止" : "已停止") + "）"; }).join("\n") +
      "\n先删除（或更换解析规则）这些数据接入，再删除此规则。");
    return;
  }
  if (confirmDeleteRule !== t) {
    confirmDeleteRule = t;
    setTimeout(function () { confirmDeleteRule = null; }, 4000);
    alert("物理删除解析规则「" + t.name + "」？此操作不可撤销。再次点击确认。");
    return;
  }
  TEMPLATES = TEMPLATES.filter(function (x) { return x.id !== t.id; });
  confirmDeleteRule = null;
  refreshTplTable();
}

/* 解析模式试算引擎（原型演示等价实现；真实实现在 Go 引擎） */
function parseByMode(mode, sample, draft) {
  if (mode === "json") {
    const obj = JSON.parse(sample);
    const flat = {};
    (function walk(prefix, o) {
      for (const k in o) {
        const path = prefix ? prefix + "." + k : k;
        if (o[k] && typeof o[k] === "object" && !Array.isArray(o[k])) walk(path, o[k]);
        else flat[path] = o[k];
      }
    })("", obj);
    return flat;
  }
  if (mode === "regex") {
    /* UI 教 Go 语法 (?P<name>)；演示引擎翻译为 JS (?<name>)。真实 Go 引擎原生支持。 */
    const m = new RegExp((draft.pattern || "").replace(/\(\?P</g, "(?<")).exec(sample);
    if (!m) return null;
    const out = {};
    for (const g in m.groups || {}) out[g] = m.groups[g];
    return Object.keys(out).length ? out : null;
  }
  if (mode === "kv") {
    const kvSep = draft.kvSep || "=", entrySep = draft.entrySep || " ";
    const quote = draft.quote || "";
    const out = {};
    let cur = "", key = "", inQuote = false;
    for (const ch of sample) {
      if (quote && ch === quote) { inQuote = !inQuote; continue; }
      if (!inQuote && ch === kvSep && key === "") { key = cur.trim(); cur = ""; continue; }
      if (!inQuote && ch === entrySep && key !== "") { out[key] = cur.trim(); key = ""; cur = ""; continue; }
      cur += ch;
    }
    if (key !== "") out[key] = cur.trim();
    return Object.keys(out).length ? out : null;
  }
  if (mode === "delimiter") {
    const delim = draft.delim || ",";
    const cols = (draft.columns || "").split(",").map(function (x) { return x.trim(); }).filter(Boolean);
    const parts = sample.split(delim).map(function (x) { return x.trim(); });
    const out = {};
    cols.forEach(function (c, i) { if (parts[i] !== undefined) out[c] = parts[i]; });
    return Object.keys(out).length ? out : null;
  }
  if (mode === "cef") {
    const idx = sample.indexOf("CEF:");
    if (idx < 0) return null;
    const parts = sample.slice(idx).split("|");
    if (parts.length < 8) return null;
    const out = { Version: parts[0].slice(4), DeviceVendor: parts[1], DeviceProduct: parts[2],
      DeviceVersion: parts[3], SignatureID: parts[4], Name: parts[5], Severity: parts[6] };
    (parts.slice(7).join("|").match(/\S+=\S+/g) || []).forEach(function (pair) {
      const eq = pair.indexOf("=");
      if (eq > 0) out[pair.slice(0, eq)] = pair.slice(eq + 1);
    });
    return out;
  }
  return null;
}

/* ---------- 解析规则编辑器（YAML） ----------
   统一管理模型（调研结论，见 spec「解析规则管理」节）：
   - 内置解析规则：仓库 YAML + go:embed，只读（升级走发版，不覆盖用户改动——Wazuh custom decoders 同款策略）
   - 自定义解析规则：同一 YAML schema，存数据库表 ingest.rules(yaml text)，运行时与内置合并加载
   - 「编辑」内置解析规则 = 复制为自定义副本再改（Wazuh：copy to /etc/decoders 再排除原文件） */
/* ---------- 解析规则编辑器（样本驱动，实时解析，左右分栏） ----------
   布局对齐 Elastic Grok Debugger：左侧样本与解析字段，右侧映射。
   实时解析：样本输入即出字段，无需点击试算。样本上限 50 条。 */function openRuleEditor(t) {
  const isNew = !t;
  const base = t ? JSON.parse(JSON.stringify(t)) : null;
  if (t && !t.custom) { base.id = base.id + "-custom"; base.custom = true; }
  $("#ruleEdTitle").textContent = isNew ? "创建解析规则" : (t.custom ? "编辑解析规则" : "复制内置解析规则");
  $("#ruleEdHint").textContent = t && !t.custom
    ? "内置解析规则只读；保存将创建自定义副本" : "自定义解析规则保存到数据库";

  const draft = {
    mode: base ? (base.parser || "json") : "json",
    pattern: base ? (base.regex || "") : "",
    kvSep: base ? (base.kv_delimiter || "=") : "=",
    entrySep: base ? (base.kv_entry || " ") : " ",
    quote: base ? (base.kv_quote || "") : "",
    delim: base ? (base.delimiter || ",") : "",
    columns: base ? (base.columns || []).join(",") : ""
  };
  const samples = t ? defaultSample(t).split("\n") : [""];
  let parsedFields = {};        // 字段 -> 最近解析值
  let mappedTargets = {};       // 目标 -> true（已映射标记）

  const left = $("#ruleEdLeft");
  const right = $("#ruleEdRight");
  left.replaceChildren();
  right.replaceChildren();

  /* ---- 顶部基础信息（跨两栏之上） ---- */
  const headBox = document.createElement("div");
  left.parentNode.insertBefore(headBox, left);
  headBox.replaceChildren();
  headBox.className = "editor-basics";
  headBox.style.cssText = "display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 18px 0";
  headBox.append(
    el("div", { class:"field" }, el("label", {}, "规则名称"),
      el("input", { id:"reName", value: base ? base.name + (base.custom ? "" : "（自定义）") : "" })),
    el("div", { class:"field" }, el("label", {}, "厂商"),
      el("input", { id:"reVendor", value: base ? base.vendor : "" })),
    el("div", { class:"field" }, el("label", {}, "产品"),
      el("input", { id:"reProduct", value: base ? (base.product || "") : "" })),
    el("div", { class:"field" }, el("label", {}, "规则描述"),
      el("input", { id:"reDesc", value: base ? (base.description || "") : "" })));

  /* ---- 左栏：解析方式 + 样本 + 实时字段 ---- */
  const modeSel = el("select", { id:"reMode", style:"width:100%" });
  Object.keys(PARSE_MODES).forEach(function (k) {
    modeSel.append(el("option", { value:k, selected: draft.mode === k ? "selected" : null },
      PARSE_MODES[k].label + " — " + PARSE_MODES[k].desc));
  });
  modeSel.addEventListener("change", function () { draft.mode = modeSel.value; renderAll(); });
  left.append(el("div", { class:"field" },
    el("label", {}, "解析方式"), modeSel));
  const modeParams = el("div");
  left.append(modeParams);

  const sampleList = el("div", { class:"fieldset", style:"gap:8px" });
  const addBtn = el("button", { class:"btn btn-outline btn-sm", onclick:function(){ addSampleRow(""); } },
    "+ 添加样本（", String(samples.length) + "/" + SAMPLE_LIMIT + "）");

  left.append(el("div", { class:"fieldset" },
    el("div", { class:"legend" }, "样本日志",
      el("span", { class:"hint-inline live-badge" }, "输入即实时解析 · 上限 " + SAMPLE_LIMIT + " 条")),
    sampleList,
    el("div", { style:"margin-top:8px" }, addBtn)));

  left.append(el("div", { class:"fieldset" },
    el("div", { class:"legend" }, "解析出的字段", el("span", { class:"hint-inline" }, "点击字段添加映射")),
    el("div", { class:"field-chips", id:"reFieldChips" })));

  /* ---- 右栏：字段映射 + 时间/severity ---- */
  right.append(el("div", { class:"fieldset" },
    el("div", { class:"legend" }, "字段映射", el("span", { class:"hint-inline" }, "解析字段 → 平台标准 event 字段（dot-path）")),
    el("div", { id:"reMapRows", class:"fieldset", style:"gap:6px" }),
    el("button", { class:"btn btn-outline btn-sm", style:"align-self:flex-start", onclick:function(){ addMapRow("", ""); } }, "+ 添加映射")));
  right.append(el("div", { class:"grid-2" },
    el("div", { class:"field" }, el("label", {}, "时间字段"),
      el("input", { id:"reTimeField", value: base ? base.timeField : "", placeholder:"time" })),
    el("div", { class:"field" }, el("label", {}, "severity 字段（可选）"),
      el("input", { id:"reSevField", value: base && base.severityField ? base.severityField : "", placeholder:"level" }))));

  const OCSF_SUGGESTIONS = ["src_endpoint.ip","dst_endpoint.ip","src_endpoint.port","dst_endpoint.port",
    "message","finding_info.title","finding_info.types","actor.user.name","device.hostname",
    "severity_id","activity_name","cloud.region","file.path","process.name"];

  function addSampleRow(text) {
    if (sampleList.children.length >= SAMPLE_LIMIT) return;
    const ta = el("textarea", { class:"sample-ta" });
    ta.value = text;
    ta.addEventListener("input", debounce(liveParse, 300));
    const status = el("div", { class:"sample-status" });
    const del = el("button", { class:"sample-del", "aria-label":"删除样本", html:
      '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>' });
    del.addEventListener("click", function () {
      if (sampleList.children.length <= 1) return;
      row.remove(); updateSampleCount(); liveParse();
    });
    const row = el("div", {}, el("div", { class:"sample-row" }, ta, del), status);
    sampleList.append(row);
    updateSampleCount();
  }
  function updateSampleCount() {
    addBtn.textContent = "+ 添加样本（" + sampleList.children.length + "/" + SAMPLE_LIMIT + "）";
    addBtn.disabled = sampleList.children.length >= SAMPLE_LIMIT;
  }

  function addMapRow(src, dst) {
    const srcSel = el("select");
    const known = Object.keys(Object.assign({}, parsedFields));
    if (known.length) {
      known.forEach(function (k) {
        srcSel.append(el("option", { value:k, selected: k === src ? "selected" : null }, k));
      });
    } else {
      srcSel.append(el("option", { value: src || "" }, src || "（先在左侧贴样本）"));
    }
    if (src && ![...srcSel.options].some(function (o) { return o.value === src; }))
      srcSel.append(el("option", { value:src, selected:"selected" }, src));
    const dstInput = el("input", { value:dst, placeholder:"OCSF 目标", list:"ocsfSuggest" });
    const row = el("div", { class:"map-row" },
      srcSel, el("span", { class:"map-arrow" }, "→"), dstInput,
      el("button", { class:"map-del", html:'<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>',
        onclick:function(){ row.remove(); } }));
  }
  function markMapped(src, on) {
    $$("#reFieldChips .field-chip").forEach(function (chip) {
      if (chip.dataset.field === src) chip.classList.toggle("mapped", on);
    });
  }

  /* ---- 实时解析（防抖 300ms） ---- */
  let debounceTimer = null;
  function debounce(fn, ms) {
    return function () { clearTimeout(debounceTimer); debounceTimer = setTimeout(fn, ms); };
  }
  function liveParse() {
    parsedFields = {};
    mappedTargets = {};
    let okCount = 0;
    $$(".sample-row textarea").forEach(function (ta, idx) {
      const statusEl = ta.closest("div").nextSibling;
      const text = ta.value.trim();
      ta.classList.remove("good", "bad");
      statusEl.className = "sample-status";
      statusEl.textContent = "";
      if (!text) return;
      try {
        const fields = parseByMode(draft.mode, text, draft);
        if (!fields || !Object.keys(fields).length) throw new Error("未解析出字段");
        Object.assign(parsedFields, fields);
        okCount++;
        ta.classList.add("good");
        statusEl.classList.add("ok");
        statusEl.textContent = "✓ " + Object.keys(fields).length + " 个字段";
      } catch (e) {
        ta.classList.add("bad");
        statusEl.classList.add("bad");
        statusEl.textContent = "✗ " + e.message.slice(0, 50);
      }
    });
    // 左栏字段 chips（新字段标可点击加映射）
    const chips = $("#reFieldChips");
    chips.replaceChildren();
    Object.keys(parsedFields).forEach(function (k) {
      chips.append(el("span", { class:"field-chip", "data-field":k,
        title:"点击添加到映射", onclick:function(){ addMapRow(k, ""); } }, k));
    });
    // 右栏映射行：首次按已有映射生成，字段集变化时补新行
    const mapRows = $("#reMapRows");
    const have = {};
    const knownFields = Object.keys(parsedFields);
    $$("#reMapRows .map-row").forEach(function (row) {
      const sel = row.querySelector("select");
      if (sel) have[sel.value] = true;
    });
    Object.keys(parsedFields).forEach(function (k) {
      if (have[k]) return;
      have[k] = true;
      const srcSel = el("select");
      knownFields.forEach(function (f) {
        srcSel.append(el("option", { value:f, selected: f === k ? "selected" : null }, f));
      });
      const dstInput = el("input", { placeholder:"OCSF 目标", value: base && base.fieldMap ? (base.fieldMap[k] || "") : "" });
      dstInput.addEventListener("change", function () { markMapped(srcSel.value, Boolean(dstInput.value)); });
      const delBtn = el("button", { class:"map-del", html:'<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>',
        onclick:function(){ rowEl.remove(); } });
      const rowEl = el("div", { class:"map-row" }, srcSel, el("span", { class:"map-arrow" }, "→"), dstInput, delBtn);
      mapRows.append(rowEl);
    });
    // 状态提示
    const total = $$(".sample-row textarea").filter ? 0 : 0;
  }

  /* 模式参数渲染 */
  /* 模式参数渲染 */
  function renderModeParams() {
    modeParams.replaceChildren();
    if (draft.mode === "regex") {
      modeParams.append(el("div", { class:"field" },
        el("label", {}, "正则表达式（命名捕获组即字段）"),
        el("input", { value: draft.pattern,
          placeholder:"(?P<time>...) (?P<level>...) (?P<msg>...)",
          oninput:function(e){ draft.pattern = e.target.value; debounce(liveParse, 400)(); } })));
    }
    if (draft.mode === "kv") {
      const grid = el("div", { class:"grid-3" });
      grid.append(el("div", { class:"field" }, el("label", {}, "键值分隔符"),
        el("input", { value: draft.kvSep, oninput:function(e){ draft.kvSep = e.target.value; debounce(liveParse, 400)(); } })));
      grid.append(el("div", { class:"field" }, el("label", {}, "条目分隔符"),
        el("input", { value: draft.entrySep, oninput:function(e){ draft.entrySep = e.target.value; debounce(liveParse, 400)(); } })));
      grid.append(el("div", { class:"field" }, el("label", {}, "引号字符（可选）"),
        el("input", { value: draft.quote, oninput:function(e){ draft.quote = e.target.value; debounce(liveParse, 400)(); } })));
      modeParams.append(grid);
    }
    if (draft.mode === "delimiter") {
      const grid = el("div", { class:"grid-2" });
      grid.append(el("div", { class:"field" }, el("label", {}, "列分隔符"),
        el("input", { value: draft.delim, oninput:function(e){ draft.delim = e.target.value; debounce(liveParse, 400)(); } })));
      grid.append(el("div", { class:"field" }, el("label", {}, "列名（逗号分隔，与列一一对应）"),
        el("input", { value: draft.columns, placeholder:"time,level,src_ip,msg",
          oninput:function(e){ draft.columns = e.target.value; debounce(liveParse, 400)(); } })));
      modeParams.append(grid);
    }
    if (draft.mode === "json") {
      modeParams.append(el("div", { class:"callout" }, el("span", { html:ICON.info }),
        "JSON 样本自动展开字段树（含嵌套，dot-path 表示），无需参数。"));
    }
    if (draft.mode === "cef") {
      modeParams.append(el("div", { class:"callout" }, el("span", { html:ICON.info }),
        "CEF 头部 7 段与扩展区 key=value 自动解析，字段名为行业约定，开箱即用。"));
    }
  }
  function renderAll() { renderModeParams(); liveParse(); }

  /* ---- 初始化 ---- */
  samples.forEach(function (line) { addSampleRow(line); });
  renderModeParams();
  // 首次解析（延后一帧，等 DOM 稳定）
  setTimeout(liveParse, 50);

  /* ---- 保存 ---- */
  function collectRule() {
    const rule = base || T("custom-" + Date.now().toString(16), "", "新解析规则", "", "", "自定义", "detection", 2004, "detection_finding", "0.1.0", 0, false, null, null, null, "time", "rfc3339", {}, null, {});
    rule.name = $("#reName").value || "未命名解析规则";
    rule.vendor = $("#reVendor").value || "";
    rule.product = $("#reProduct").value || "";
    rule.description = $("#reDesc").value;
    rule.custom = true;
    rule.parser = draft.mode;
    if (draft.mode === "regex") rule.regex = draft.pattern;
    if (draft.mode === "kv") { rule.kv_delimiter = draft.kvSep; rule.kv_entry = draft.entrySep; if (draft.quote) rule.kv_quote = draft.quote; }
    if (draft.mode === "delimiter") { rule.delimiter = draft.delim; rule.columns = (draft.columns || "").split(",").map(function (x) { return x.trim(); }).filter(Boolean); }
    rule.timeField = $("#reTimeField").value || rule.timeField;
    rule.severityField = $("#reSevField").value || null;
    rule.fieldMap = {};
    $$("#reMapRows .map-row").forEach(function (row) {
      const sel = row.querySelector("select");
      const input = row.querySelector("input");
      if (sel && input && sel.value && input.value) rule.fieldMap[sel.value] = input.value;
    });
    return rule;
  }
  $("#ruleEdSave").onclick = function () {
    const rule = collectRule();
    const existing = TEMPLATES.findIndex(function (x) { return x.id === rule.id; });
    if (existing >= 0) TEMPLATES[existing] = rule; else TEMPLATES.push(rule);
    refreshTplTable(); hideSheets();
  };
  showSheet($("#ruleSheet"));
}

/* ---------- 解析规则详情 ---------- */
/* ---------- 解析规则详情 ---------- */
function openTemplate(t) {
  $("#tplTitle").textContent = t.name;
  $("#tplSub").textContent = t.vendor + " · v" + t.version + " · " + t.group +
    (t.experimental ? " · 实验性" : "");
  const body = $("#tplBody");
  body.replaceChildren();

  const chain = inheritanceChain(t);
  const contract = el("dl", { class:"panel" });
  const addRow = function (label, valueHtml) {
    contract.append(el("div", { class:"panel-row" }, el("dt", {}, label), el("dd", {}, valueHtml)));
  };
  addRow("id", el("span", { class:"mono" }, t.id));
  addRow("kind", t.kind + "（生产者声明，不靠 severity 推断）");
  addRow("class_uid", el("span", { class:"mono" }, t.classUid + " " + t.className));
  addRow("时间", el("span", { class:"mono" }, t.timeField + " · " + t.timeFormat));
  addRow("severity", t.severityField
    ? t.severityField + " · " + Object.keys(t.severityMap).join("／")
    : "未声明（固定 0 Unknown）");
  addRow("继承", el("span", { class:"mono" },
    chain.length > 1 ? chain.map(function (x) { return x.id; }).join(" → ") + "（逐键覆盖）" : "无"));
  addRow("disposition", t.disposition ? "security_control · " + t.disposition.field : "无（非阻断类）");
  addRow("校验", el("span", {}, badge("ok", "通过"), " 加载时校验 class_uid 与 severity 值域"));
  addRow("来源", t.custom ? "自定义（数据库）" : "内置（随二进制分发）");
  body.append(el("div", { class:"fieldset" }, el("div", { class:"legend" }, "契约"), contract));

  const map = el("table", { class:"map-table" });
  map.append(el("tr", {}, el("th", {}, "厂商字段"), el("th", {}, "OCSF 目标")));
  for (const src in t.fieldMap) map.append(el("tr", {}, el("td", { class:"map-src mono" }, src), el("td", { class:"mono" }, t.fieldMap[src])));
  body.append(el("div", { class:"fieldset" }, el("div", { class:"legend" }, "字段映射"), map));

  if (Object.keys(t.constants).length) {
    const cs = el("table", { class:"map-table" });
    cs.append(el("tr", {}, el("th", {}, "常量目标"), el("th", {}, "值")));
    for (const k in t.constants) cs.append(el("tr", {}, el("td", { class:"map-src mono" }, k), el("td", {}, t.constants[k])));
    body.append(el("div", { class:"fieldset" }, el("div", { class:"legend" }, "常量"), cs));
  }

  const tplFoot = $("#tplSheet .sheet-foot");
  tplFoot.replaceChildren(
    el("span", { class:"dim", style:"font-size:12px" },
      t.custom ? "自定义解析规则（数据库）" : "内置解析规则随二进制分发，只读；要改请从列表「编辑」创建自定义副本"));
  showSheet($("#tplSheet"));
}

/* ---------- 启动 ---------- */
navigate("connectors");

</script>
</body>
