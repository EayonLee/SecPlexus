<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 770" width="1040" height="770" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto">
      <path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#94a3b8"/>
    </marker>
    <marker id="arp" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto">
      <path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="1040" height="770" fill="#ffffff"/>

  <text x="570" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">SecPlexus 模块与 IAM 关系</text>

  <!-- ==================== 入口 ==================== -->
  <text x="122" y="97" text-anchor="end" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="1">入口</text>

  <rect x="505" y="66" width="130" height="54" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="570" y="90" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">浏览器</text>
  <text x="570" y="107" text-anchor="middle" font-size="10" fill="#64748b">Cookie + CSRF</text>

  <line x1="570" y1="120" x2="570" y2="142" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="470" y="146" width="200" height="60" rx="9" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="570" y="171" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e40af">Web · Next.js</text>
  <text x="570" y="190" text-anchor="middle" font-size="10" fill="#3b82f6">同源窄代理 /api/v1/*</text>

  <!-- ==================== 业务模块 ==================== -->
  <text x="122" y="296" text-anchor="end" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="1">业务模块</text>

  <line x1="570" y1="206" x2="570" y2="222" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="235" y1="222" x2="904" y2="222" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="235" y1="222" x2="235" y2="246" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="458" y1="222" x2="458" y2="246" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arp)"/>
  <line x1="681" y1="222" x2="681" y2="246" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arp)"/>
  <line x1="904" y1="222" x2="904" y2="246" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arp)"/>

  <rect x="140" y="248" width="190" height="88" rx="9" fill="#fefce8" stroke="#fbbf24" stroke-width="2"/>
  <text x="235" y="288" text-anchor="middle" font-size="13" font-weight="600" fill="#854d0e">Console</text>
  <text x="235" y="309" text-anchor="middle" font-size="10.5" fill="#a16207">安全运营</text>

  <rect x="363" y="248" width="190" height="88" rx="9" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="458" y="288" text-anchor="middle" font-size="13" font-weight="600" fill="#6d28d9">llm-gateway</text>
  <text x="458" y="309" text-anchor="middle" font-size="10.5" fill="#7c3aed">模型出口</text>

  <rect x="586" y="248" width="190" height="88" rx="9" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="681" y="288" text-anchor="middle" font-size="13" font-weight="600" fill="#6d28d9">collector</text>
  <text x="681" y="309" text-anchor="middle" font-size="10.5" fill="#7c3aed">接入归一化</text>

  <rect x="809" y="248" width="190" height="88" rx="9" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="904" y="288" text-anchor="middle" font-size="13" font-weight="600" fill="#6d28d9">correlator 等</text>
  <text x="904" y="309" text-anchor="middle" font-size="10.5" fill="#7c3aed">关联 / 研判 / 处置</text>

  <!-- ==================== 身份与授权 ==================== -->
  <text x="122" y="514" text-anchor="end" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="1">身份与授权</text>

  <line x1="235" y1="336" x2="235" y2="368" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="458" y1="336" x2="458" y2="368" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="681" y1="336" x2="681" y2="368" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="904" y1="336" x2="904" y2="368" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="235" y1="368" x2="904" y2="368" stroke="#94a3b8" stroke-width="1.5"/>

  <line x1="570" y1="372" x2="570" y2="405" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="586" y="393" font-size="9.5" fill="#94a3b8">各自独立调用</text>

  <rect x="370" y="410" width="400" height="200" rx="10" fill="#ecfdf5" stroke="#34d399" stroke-width="2.5"/>
  <text x="570" y="444" text-anchor="middle" font-size="17" font-weight="700" fill="#065f46">IAM</text>
  <text x="570" y="464" text-anchor="middle" font-size="10" fill="#059669">Go + Gin · :8081</text>
  <line x1="402" y1="478" x2="738" y2="478" stroke="#a7f3d0" stroke-width="1"/>

  <text x="570" y="504" text-anchor="middle" font-size="11" fill="#047857">账号 · 组织树 · 角色权限</text>
  <text x="570" y="526" text-anchor="middle" font-size="11" fill="#047857">登录 · 会话 · 二次认证 · 审计</text>
  <text x="570" y="548" text-anchor="middle" font-size="11" fill="#047857">滚动续期 · 令牌轮换 · 即时撤销</text>

  <line x1="402" y1="566" x2="738" y2="566" stroke="#a7f3d0" stroke-width="1"/>
  <text x="570" y="588" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">身份与授权唯一权威源</text>

  <!-- ==================== 存储 ==================== -->
  <rect x="800" y="422" width="200" height="84" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="900" y="450" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">PostgreSQL</text>
  <text x="900" y="469" text-anchor="middle" font-size="10" fill="#64748b">iam schema · 11 张表</text>
  <text x="900" y="487" text-anchor="middle" font-size="9.5" fill="#94a3b8">组织树触发器 · 复合外键</text>

  <rect x="800" y="530" width="200" height="84" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="900" y="558" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">Redis</text>
  <text x="900" y="577" text-anchor="middle" font-size="10" fill="#dc2626">登录限流计数</text>
  <text x="900" y="595" text-anchor="middle" font-size="9.5" fill="#94a3b8">故障时 503，不放行</text>

  <line x1="770" y1="464" x2="797" y2="464" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="770" y1="572" x2="797" y2="572" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- ==================== 图例与说明 ==================== -->
  <rect x="140" y="650" width="860" height="100" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <rect x="160" y="665" width="22" height="13" rx="4" fill="#fefce8" stroke="#fbbf24" stroke-width="1.6"/>
  <text x="190" y="676" font-size="10" fill="#475569">已交付</text>

  <rect x="250" y="665" width="22" height="13" rx="4" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="280" y="676" font-size="10" fill="#7c3aed">规划中，名称与职责可能调整</text>

  <line x1="450" y1="671" x2="476" y2="671" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="484" y="676" font-size="10" fill="#475569">已交付链路</text>

  <line x1="570" y1="671" x2="596" y2="671" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="604" y="676" font-size="10" fill="#7c3aed">规划链路</text>

  <text x="160" y="706" font-size="10" fill="#64748b">业务模块彼此平级，不互相代理。每个模块都从 Web 同源入口进入，各自独立向 IAM 要授权结论。</text>
  <text x="160" y="728" font-size="10" fill="#64748b">Console 不是网关，也不是权限中转站。新增模块只需在 IAM 侧登记 service_clients，调用方改用 iamclient。</text>
</svg>
