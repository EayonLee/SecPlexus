# IAM 模块配置。部署选项集中在根 .env.example。
# 根启动入口按进程环境、根 .env、模块默认值的顺序取值。
# 二进制直接运行时读取进程环境和本文件。修改后重启进程或重新创建容器。

# 进程监听
# 应用监听 HTTP。对外 HTTPS 由反向代理终止。
app:
  # 本机监听地址。Compose 在容器内监听 0.0.0.0。
  host: "${SPX_IAM_BIND_HOST-127.0.0.1}"
  # 同一端口同时用于监听和服务间连接。
  port: "${SPX_IAM_PORT-8081}"
  # 可信反向代理网段，逗号分隔。留空时按直连地址识别请求来源。
  trusted_proxy_cidrs: "${SPX_IAM_TRUSTED_PROXY_CIDRS-}"

# 服务间调用凭证
# 每个调用方（console 等）有独立 token，且只能请求这里列出的 action。
# token 同时充当两件事：证明"我是某个内部服务"，以及限定"我能问哪些权限问题"。
# 它不能替代登录用户——IAM 校验完服务凭证后，还要再校验调用方带来的用户 Cookie。
service_clients:
  console:
    # console 调用 IAM 用的独立服务凭据，长度 32–512 字节。
    token: "${SPX_CONSOLE_IAM_TOKEN-}"
    # console 被允许请求的 action 白名单。不在这个列表里的 action 一律拒绝。
    actions: [console.context.read, iam.permissions.read]

  ingest:
    # ingest 调用 IAM 的独立服务凭据，长度 32–512 字节。
    token: "${SPX_INGEST_IAM_TOKEN-}"
    # 启动时读取权限键以校验契约；具体管理操作仍校验原用户会话。
    actions: [ingest.events.read, ingest.input.read, ingest.input.write, ingest.parsing_rule.read, ingest.parsing_rule.write, iam.audit.write, iam.permissions.read]

# PostgreSQL
# 自带实例共用一组连接参数，并按模块 schema 管理数据。外接实例使用完整连接 URL。
postgresql:
  # 自带实例地址。Compose 通过服务名注入。
  host: "${SPX_POSTGRESQL_HOST-127.0.0.1}"
  # 数据库端口，PG 默认 5432。
  port: "${SPX_POSTGRESQL_PORT-5432}"
  # 数据库名。默认 secplexus，全平台所有模块共用一个库。
  database: "${SPX_POSTGRESQL_DATABASE-secplexus}"
  # 数据库账号。需要能建表、建索引、执行迁移。
  user: "${SPX_POSTGRESQL_USER-secplexus}"
  # 数据库密码。生产环境必须通过环境变量或 .env 覆盖。
  password: "${SPX_POSTGRESQL_PASSWORD-secplexus}"
  # 独立运行连接外部实例时填写。TLS 模式使用 URL 的 sslmode 参数。
  url: "${SPX_POSTGRESQL_URL-}"

# Redis
# 全平台共用一个 Redis，用 key 前缀（spx:iam:...）区分模块，不靠第二个实例。
# IAM 主要用它做登录限流；限流计数丢了会让暴力破解防护短暂失效，所以 Redis 挂了登录写操作要拒绝（不是放行）。
redis:
  # Redis 地址。
  host: "${SPX_REDIS_HOST-127.0.0.1}"
  # Redis 端口，默认 6379。
  port: "${SPX_REDIS_PORT-6379}"
  # Redis ACL 用户名。Redis 6+ 默认用户名是 default；外部 Redis 需预先建好这个用户并授权。
  user: "${SPX_REDIS_USER-default}"
  # Redis 密码。
  password: "${SPX_REDIS_PASSWORD-secplexus}"
  # Redis 逻辑库编号（0-15）。不同平台部署可以用不同库号隔离，但同一部署内所有模块用同一个。
  db: "${SPX_REDIS_DB-0}"
  # 完整 Redis 连接串（redis://用户:密码@主机:端口/库号）。填了就替代上面的分项字段。
  url: "${SPX_REDIS_URL-}"

# 托管管理员
# 首次部署由 initialize-administrator 创建。已有实例改名或改密时执行 sync-administrator。
bootstrap:
  # 首次部署须填写 12–128 个字符的密码。
  username: "${SPX_IAM_BOOTSTRAP_USERNAME-admin}"
  password: "${SPX_IAM_BOOTSTRAP_PASSWORD-}"

# 账号与登录策略
auth:
  # IAM 使用实际浏览器来源校验请求并决定 Cookie 的 Secure 属性。
  web_origin: "${SPX_WEB_ORIGIN:-http://127.0.0.1:${SPX_WEB_PORT-5173}}"
  # CSRF 签名密钥必填，恰好 32 字节。
  csrf_key: "${SPX_IAM_CSRF_KEY-}"

  # 登录限流分别按来源 IP（每分钟）和账号（每 15 分钟）计数。
  login_ip_rate: "${SPX_IAM_LOGIN_IP_RATE-60}"
  login_account_rate: "${SPX_IAM_LOGIN_ACCOUNT_RATE-20}"
  # 账号连续登录失败达到阈值后的锁定时长。
  login_max_failures: "${SPX_IAM_LOGIN_MAX_FAILURES-5}"
  login_lock_duration: "${SPX_IAM_LOGIN_LOCK_DURATION-15m}"

  # 会话空闲时限、最长时限及二次认证窗口。
  # 最长时限必须大于或等于空闲时限，且不超过 7 天。
  session_idle_timeout: "${SPX_IAM_SESSION_IDLE_TIMEOUT-30m}"
  session_absolute_timeout: "${SPX_IAM_SESSION_ABSOLUTE_TIMEOUT-8h}"
  reauth_window: "${SPX_IAM_REAUTH_WINDOW-30m}"

# 保留期
# 单位为天。由 IAM maintain 按批清理，部署侧负责调度。
retention:
  audit_days: "${SPX_IAM_AUDIT_RETENTION_DAYS-365}"
  session_days: "${SPX_IAM_SESSION_RETENTION_DAYS-30}"

# 日志
# 输出结构化 JSON。Compose 由 Docker 管理标准输出及轮转。
logging:
  # 日志级别，支持 debug、info、warn、error。
  level: "${SPX_IAM_LOG_LEVEL-info}"
  # 以下选项用于独立运行。文件路径留空时关闭文件日志。
  stdout: "${SPX_IAM_LOG_STDOUT-true}"
  file: "${SPX_IAM_LOG_FILE-logs/iam.log}"
  # MAX_SIZE_MB 按 MiB 计，MAX_AGE_DAYS 按天计。
  max_size_mb: "${SPX_IAM_LOG_MAX_SIZE_MB-50}"
  max_backups: "${SPX_IAM_LOG_MAX_BACKUPS-5}"
  max_age_days: "${SPX_IAM_LOG_MAX_AGE_DAYS-14}"
  compress: "${SPX_IAM_LOG_COMPRESS-true}"
