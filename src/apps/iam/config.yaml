# 应用监听。host为绑定IP，port为整数；公共URL用于Cookie与CSRF来源校验。
app:
  name: "iam"
  host: "0.0.0.0"
  port: 8081
  public_url: "http://127.0.0.1:5173"
  # 只信任明确配置的反向代理网段；多个网段用逗号分隔。
  trusted_proxy_cidrs: ""

# PostgreSQL默认连接全局配置；需要独立连接时修改本模块字段即可。
# 运行、迁移和维护使用同一连接，账号需有本项目的建表和迁移权限。
db:
  host: "127.0.0.1"
  port: 5432
  name: "secplexus"
  user: "secplexus"
  password: "secplexus"
  sslmode: "disable"
  # 完整DSN仅用于需要额外驱动参数的连接；通常填写上面的字段即可。
  url: ""

# Redis共用全局连接，通过前缀和模块/业务模板区分key。
cache:
  host: "127.0.0.1"
  port: 6379
  # 外部 Redis 需预先建立对应 ACL 用户；自带 Compose 会按同一配置创建。
  user: "default"
  password: "secplexus"
  db: 0
  url: ""

# 内部鉴权监听与TLS；相对路径以进程工作目录为准，环境变量可传绝对路径。
internal:
  host: "0.0.0.0"
  port: 9081
  tls_cert_file: "certs/iam.crt"
  tls_key_file: "certs/iam.key"
  clients:
    console:
      token: ""
      actions: [iam.organizations.read]

# 账号与登录策略。密码、密钥和调用凭证通过环境变量或私有.env填写。
auth:
  csrf_key: ""
  session_idle_timeout: "30m"
  session_absolute_timeout: "8h"
  reauth_window: "5m"
  login_max_failures: 5
  login_lock_duration: "15m"
bootstrap:
  username: "admin"
  # 仅空账号库需要；不会重置已有管理员密码。
  password: "secplexus"
retention:
  audit_days: 180
  session_days: 30

# 源码/二进制默认写根logs目录。容器可把file设为空，仅保留stdout。
logging:
  level: "info"
  stdout: true
  file: "logs/iam.log"
  max_size_mb: 50
  max_backups: 5
  max_age_days: 14
  compress: true
