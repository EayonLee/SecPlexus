# Ingest 模块配置。部署选项集中在根 .env.example。
# 根启动入口按进程环境、根 .env、模块默认值的顺序取值。
# 二进制直接运行时读取进程环境和本文件。修改后重启进程或重新创建容器。

# 进程监听
# 整栈 Compose 使用 HTTP，对外 HTTPS 由反向代理终止。
# 独立运行可在 input.http 配置原生 TLS。
app:
  # 本机监听地址。Compose 在容器内监听 0.0.0.0。
  host: "${SPX_INGEST_BIND_HOST-127.0.0.1}"
  # 同一端口同时用于监听和服务间连接。
  port: "${SPX_INGEST_PORT-8082}"

# 上游 IAM
# Ingest 通过 IAM 接口校验用户会话与操作权限。
iam:
  # 同机启动使用本机地址。Compose 使用 IAM 的服务名。
  host: "${SPX_IAM_HOST-127.0.0.1}"
  # IAM 服务端口，必须与 IAM 实际监听端口一致。
  port: "${SPX_IAM_PORT-8081}"
  # 调用 IAM 的独立服务凭据，长度 32–512 字节。
  token: "${SPX_INGEST_IAM_TOKEN-}"

# PostgreSQL
# 存放数据接入、解析规则及运行位移边界。
postgresql:
  # 以下是自带实例的连接参数。
  host: "${SPX_POSTGRESQL_HOST-127.0.0.1}"
  port: "${SPX_POSTGRESQL_PORT-5432}"
  database: "${SPX_POSTGRESQL_DATABASE-secplexus}"
  user: "${SPX_POSTGRESQL_USER-secplexus}"
  # 密码只从环境变量/私有 .env 注入，不要写进版本库。
  password: "${SPX_POSTGRESQL_PASSWORD-secplexus}"
  # 独立运行连接外部实例时填写。TLS 模式使用 URL 的 sslmode 参数。
  url: "${SPX_POSTGRESQL_URL-}"

# Redis
# IAM 和 Ingest 共用一个逻辑库，HTTP 接入限流按模块键前缀区分。
redis:
  # 分项与 url 二者择一；url 优先级更高。
  host: "${SPX_REDIS_HOST-127.0.0.1}"
  port: "${SPX_REDIS_PORT-6379}"
  user: "${SPX_REDIS_USER-default}"
  password: "${SPX_REDIS_PASSWORD-secplexus}"
  # 与 IAM 共用逻辑库，使用模块前缀区分数据。
  db: "${SPX_REDIS_DB-0}"
  # 完整 Redis 连接串；填了就替代上面的分项字段。
  url: "${SPX_REDIS_URL-}"

# 平台 Kafka
kafka:
  # 独立运行填写集群连接。Compose 使用自带 Kafka。
  brokers: "${SPX_KAFKA_BROKERS-}"
  security_protocol: "${SPX_KAFKA_SECURITY_PROTOCOL-plaintext}"
  tls_ca_file: "${SPX_KAFKA_TLS_CA_FILE-}"
  namespace: "${SPX_KAFKA_NAMESPACE-spx}"
  retention_days: "${SPX_KAFKA_RETENTION_DAYS-7}"

# ClickHouse 事件存储。写入、回查和迁移身份分别配置。
clickhouse:
  url: "${SPX_CLICKHOUSE_URL-}"
  database: "${SPX_INGEST_CLICKHOUSE_DATABASE-spx}"
  username: "${SPX_INGEST_CLICKHOUSE_USERNAME-}"
  password: "${SPX_INGEST_CLICKHOUSE_PASSWORD-}"

  reader_username: "${SPX_INGEST_CLICKHOUSE_READER_USERNAME-}"
  reader_password: "${SPX_INGEST_CLICKHOUSE_READER_PASSWORD-}"

  migration_username: "${SPX_INGEST_CLICKHOUSE_MIGRATION_USERNAME-}"
  migration_password: "${SPX_INGEST_CLICKHOUSE_MIGRATION_PASSWORD-}"

  timeout: 15s

# 数据接入
input:
  # 设备推送（HTTP）。限流按数据接入分别计数。
  http:
    # 请求体上限按字节计，并发上限为同一实例同时处理的请求数。
    max_body_bytes: "${SPX_INGEST_HTTP_MAX_BODY_BYTES-10485760}"
    max_concurrent_requests: "${SPX_INGEST_HTTP_MAX_CONCURRENT_REQUESTS-16}"
    # 每个数据接入的每秒请求配额与突发额度。
    rate_per_sec: "${SPX_INGEST_HTTP_RATE_PER_SEC-50}"
    rate_burst: "${SPX_INGEST_HTTP_RATE_BURST-200}"

    # 独立运行的原生 TLS。证书和私钥须同时填写。
    tls_cert_file: "${SPX_INGEST_TLS_CERT_FILE-}"
    tls_key_file: "${SPX_INGEST_TLS_KEY_FILE-}"

  # 外部 Kafka 接入。broker 和主题由对应的数据接入指定。
  kafka:
    reload_interval: "${SPX_INGEST_INPUT_KAFKA_RELOAD_INTERVAL-30s}"
    # 生产连接按数据接入选择凭据名，口令由环境注入，见 README。
    credentials: {}

  # Syslog 接入。TCP 和 UDP 使用数据接入登记的端口。
  syslog:
    # 端口绑定关系的刷新间隔。
    reload_interval: "${SPX_INGEST_SYSLOG_RELOAD_INTERVAL-10s}"
    # 独立运行可指定监听地址，留空时跟随 Ingest 监听地址。
    host: "${SPX_INGEST_SYSLOG_HOST-}"

# 解析与批量发布
pipeline:
  # Worker 数为 0 时按可用 CPU 自动选择。
  workers: "${SPX_INGEST_WORKERS-0}"
  # 待解析队列按条数计，待解析及正在解析的输入共用字节预算。
  queue_depth: "${SPX_INGEST_QUEUE_DEPTH-10000}"
  max_in_flight_bytes: "${SPX_INGEST_MAX_IN_FLIGHT_BYTES-67108864}"

  # 发布批量按条数计，未满批时按最长等待时间发布。
  batch_size: "${SPX_INGEST_BATCH_SIZE-500}"
  flush_interval: "${SPX_INGEST_FLUSH_INTERVAL-2s}"

# 事件写入
# Kafka 发布与写入使用独立身份。
events:
  publisher:
    sasl_mechanism: "${SPX_INGEST_KAFKA_PUBLISH_SASL_MECHANISM-}"
    sasl_username: "${SPX_INGEST_KAFKA_PUBLISH_SASL_USERNAME-}"
    sasl_password: "${SPX_INGEST_KAFKA_PUBLISH_SASL_PASSWORD-}"

  consumer:
    sasl_mechanism: "${SPX_INGEST_KAFKA_STORE_SASL_MECHANISM-}"
    sasl_username: "${SPX_INGEST_KAFKA_STORE_SASL_USERNAME-}"
    sasl_password: "${SPX_INGEST_KAFKA_STORE_SASL_PASSWORD-}"

  # ClickHouse 写入批次与表结构核对间隔。
  batch_records: 1000
  batch_bytes: 4194304
  check_interval: 1m

# 日志
# 输出结构化 JSON。Compose 由 Docker 管理标准输出及轮转。
logging:
  # 日志级别，支持 debug、info、warn、error。
  level: "${SPX_INGEST_LOG_LEVEL-info}"
  # 以下选项用于独立运行。文件路径留空时关闭文件日志。
  stdout: "${SPX_INGEST_LOG_STDOUT-true}"
  file: "${SPX_INGEST_LOG_FILE-logs/ingest.log}"
  # MAX_SIZE_MB 按 MiB 计，MAX_AGE_DAYS 按天计。
  max_size_mb: "${SPX_INGEST_LOG_MAX_SIZE_MB-50}"
  max_backups: "${SPX_INGEST_LOG_MAX_BACKUPS-5}"
  max_age_days: "${SPX_INGEST_LOG_MAX_AGE_DAYS-14}"
  compress: "${SPX_INGEST_LOG_COMPRESS-true}"
