# Console 模块配置。部署选项集中在根 .env.example。
# 根启动入口按进程环境、根 .env、模块默认值的顺序取值。
# 二进制直接运行时读取进程环境和本文件。修改后重启进程或重新创建容器。

# 进程监听
# 应用监听 HTTP。对外 HTTPS 由反向代理终止。
app:
  # 本机监听地址。Compose 在容器内监听 0.0.0.0。
  host: "${SPX_CONSOLE_BIND_HOST-127.0.0.1}"
  # 同一端口同时用于监听和服务间连接。
  port: "${SPX_CONSOLE_PORT-8080}"

# 上游 IAM
# Console 通过 IAM 接口校验用户会话与操作权限。
iam:
  # 同机启动使用本机地址。Compose 使用 IAM 的服务名。
  host: "${SPX_IAM_HOST-127.0.0.1}"
  # IAM 服务端口，必须与 IAM 实际监听端口一致。
  port: "${SPX_IAM_PORT-8081}"
  # 调用 IAM 的独立服务凭据，长度 32–512 字节。
  token: "${SPX_CONSOLE_IAM_TOKEN-}"

# 日志
# 输出结构化 JSON。Compose 由 Docker 管理标准输出及轮转。
logging:
  # 日志级别，支持 debug、info、warn、error。
  level: "${SPX_CONSOLE_LOG_LEVEL-info}"
  # 以下选项用于独立运行。文件路径留空时关闭文件日志。
  stdout: "${SPX_CONSOLE_LOG_STDOUT-true}"
  file: "${SPX_CONSOLE_LOG_FILE-logs/console.log}"
  # MAX_SIZE_MB 按 MiB 计，MAX_AGE_DAYS 按天计。
  max_size_mb: "${SPX_CONSOLE_LOG_MAX_SIZE_MB-50}"
  max_backups: "${SPX_CONSOLE_LOG_MAX_BACKUPS-5}"
  max_age_days: "${SPX_CONSOLE_LOG_MAX_AGE_DAYS-14}"
  compress: "${SPX_CONSOLE_LOG_COMPRESS-true}"
