# Console只配置实际使用的能力，没有数据库/Redis占位项。
app:
  name: "console"
  host: "0.0.0.0"
  port: 8080

# IAM内部地址及每服务凭证；不读取IAM数据库。
iam:
  base_url: "https://127.0.0.1:9081"
  token: ""
  ca_file: "certs/iam.crt"

# 多个进程不能写同一个轮转文件；容器默认stdout，由运行时轮转。
logging:
  level: "info"
  stdout: true
  file: "logs/console.log"
  max_size_mb: 50
  max_backups: 5
  max_age_days: 14
  compress: true
