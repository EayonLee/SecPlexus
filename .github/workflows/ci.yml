name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          persist-credentials: false

      - name: Install GNU Make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y --no-progress

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.3'
          cache: true

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.1.0
        with:
          version: 10.32.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: make test

  # 集成测试要真实 PostgreSQL 与 Redis，且备份恢复用例需要与服务端同主版本的 pg_dump，
  # 因此单独一个 Linux job：临时容器由 tests/integration/run.mjs 创建并在结束时清理。
  integration:
    name: Integration (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.3'
          cache: true

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.1.0
        with:
          version: 10.32.1

      # 恢复用例用宿主机的 pg_dump/pg_restore，主版本必须与 postgres:16 容器一致。
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16

      # --docker 是脚本的显式授权：创建独立临时 PG/Redis 容器、随机端口与临时凭据，结束后清理自有资源。
      - name: Run integration tests
        run: make integration ARGS="--docker"

  quality:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.3'
          cache: true

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.1.0
        with:
          version: 10.32.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Go vet
        run: go vet ./src/...

      # goinstall 让 action 用 CI 自己的 Go 1.27.3 从源码构建：
      # 预编译二进制可能由更旧的 Go 构建，会拒绝分析 go.mod 声明的更高语言版本。
      - name: Go lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: goinstall
          args: --config .golangci.yml ./src/...

      - name: Go reachable vulnerabilities
        run: make vuln-go

      - name: Web lint
        run: pnpm lint

      - name: Web type check
        run: pnpm typecheck

      - name: Catalogs and migration boundaries
        run: pnpm catalogs:check

      # 生成代码入库，必须与 queries/*.sql 同步；漂移即失败。
      - name: Generated query code is up to date
        run: make sqlc-check

  # 供应链与密钥闸门：与 test/quality 并行，不影响关键路径。
  # 三项检查都以退出码阻断，不上传 SARIF，因此不需要 security-events 权限。
  security:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          persist-credentials: false

      - name: Audit workflows and action pinning (zizmor)
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # 只要高危项阻断，避免低价值噪声把 CI 变成摆设。
          min-severity: high
          min-confidence: high
          advanced-security: false
          annotations: true

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.3'
          cache: true

      - name: Scan for committed secrets (gitleaks)
        run: go run github.com/zricethezav/gitleaks/v8@v8.28.0 dir . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Scan dependencies for known vulnerabilities (osv-scanner)
        run: >-
          go run github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.1 scan source
          --lockfile=go.mod
          --lockfile=pnpm-lock.yaml
          --config osv-scanner.toml
