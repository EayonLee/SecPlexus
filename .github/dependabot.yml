version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Major upgrades need a manual compatibility review.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Dependabot resolves the parent github.com/alexedwards/scs module and
      # reports dependency_file_not_resolvable even though Go resolves this
      # submodule correctly. Review the pseudo-version manually with go get.
      - dependency-name: "github.com/alexedwards/scs/pgxstore"

  - package-ecosystem: npm
    directory: "/src/apps/web"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      web-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Major upgrades need a manual compatibility review with Next.js.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Action major versions can change runner and Node requirements; review
      # them deliberately instead of taking them automatically.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
