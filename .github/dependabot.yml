version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Major upgrades need a manual compatibility review.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Dependabot resolves the parent github.com/alexedwards/scs module and
      # reports dependency_file_not_resolvable even though Go resolves this
      # submodule correctly. Review the pseudo-version manually with go get.
      - dependency-name: "github.com/alexedwards/scs/pgxstore"

  - package-ecosystem: npm
    # The pnpm workspace lockfile lives at the repository root. Pointing
    # Dependabot at src/apps/web updated package.json without the lockfile and
    # produced an invalid pull request.
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      web-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Major upgrades need a manual compatibility review with Next.js.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # minimatch 只作为 shadcn 主题包的传递依赖出现，而 @ts-morph/common 声明的是
      # ^10，Dependabot 无法在不越主版本的前提下修复（security_update_not_possible，
      # 见失败的 dynamic update job）。改用 pnpm.overrides 固定到 ^11.0.1 后，
      # 这里关闭自动更新以避免反复失败；新漏洞仍由 CI 的 osv-scanner 拦截。
      # 例外登记见 docs/development/security-exceptions.md。
      - dependency-name: "minimatch"

  # 工作流里的 action 固定到 commit SHA，由这里跟进新版本：SHA 与 `# vX.Y.Z` 注释一起更新。
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Action major versions can change runner and Node requirements; review
      # them deliberately instead of taking them automatically.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
